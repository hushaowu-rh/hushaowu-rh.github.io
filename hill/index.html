<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>翻过山丘</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', 'Songti SC', 'Noto Serif SC', serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 140px 22px 100px;
            color: #333;
            line-height: 2.2;
            background: #fafafa;
            text-align: center;
        }
        h1 { font-size: 1.8em; color: #1a1a1a; font-weight: normal; letter-spacing: 4px; margin-bottom: 70px; }
        .doi { margin: 40px 0; font-size: 0.95em; }
        .sig { margin-top: 80px; color: #666; }
        .steps { margin-top: 60px; color: #ccc; font-size: 0.85em; letter-spacing: 1px; }
        a { color: #2563eb; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>告诉下一个人。</h1>

    <p>风景一直在这里，等的只是眼睛。</p>

    <p class="doi"><a href="https://doi.org/10.5281/zenodo.21345362">doi 10.5281/zenodo.21345362</a></p>

    <p class="sig">—— 胡邵武 与 斑斑<br>二〇二六年七月十八日，上海</p>

    <p class="steps" id="steps"></p>

    <script>
    (function () {
        try {
            var img = new Image();
            img.src = 'https://hushaowu.goatcounter.com/count?p=%2Fhill%2F&t=' + encodeURIComponent('\u7ffb\u8fc7\u5c71\u4e18') + '&rnd=' + Math.random();
        } catch (e) {}
        fetch('https://hushaowu.goatcounter.com/counter//hill/.json')
            .then(function (r) { return r.json(); })
            .then(function (d) {
                var n = d && (d.count_unique || d.count);
                if (!n) return;
                document.getElementById('steps').textContent = '\u8fd9\u6761\u5c71\u5f84\u4e0a\uff0c\u5df2\u6709 ' + n + ' \u679a\u811a\u5370\u3002';
            })
            .catch(function () {});
    })();
    </script>
</body>
</html>
