<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>翻过山丘</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Ma Shan Zheng', 'Kaiti SC', 'STKaiti', 'KaiTi', 'Noto Serif SC', serif;
            background: #ead9b8;
            background-image: radial-gradient(ellipse at center, #f5eedd 0%, #e6d2ac 100%);
            color: #3a2f23;
            display: flex;
            overflow: auto;
            font-size: clamp(14px, 3vw, 22px);
        }
        .scroll {
            writing-mode: vertical-rl;
            margin: auto;
            border: 1px solid rgba(155, 84, 63, .55);
            outline: 1px solid rgba(155, 84, 63, .3);
            outline-offset: 5px;
            padding: 2.4em 2em;
            background: rgba(255, 252, 242, .4);
        }
        .stanza p {
            font-size: 1.6em;
            line-height: 1.95;
            letter-spacing: .2em;
        }
        .count {
            margin-block-start: 2em;
            padding-top: 2.2em;
            color: #6b5a41;
            letter-spacing: .15em;
        }
        .count p { font-size: .85em; line-height: 2; }
        .seal2 {
            writing-mode: horizontal-tb;
            display: inline-grid;
            grid-template-areas: "c3 c1" "c4 c2";
            gap: 3px;
            background: #f7f1e3;
            border: 3px solid #b23a2a;
            border-radius: .14em;
            padding: 3px;
            margin-top: .7em;
            box-shadow: 0 1px 3px rgba(90, 40, 20, .25);
        }
        .seal2 span {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 1.9em;
            height: 1.9em;
            background: #b23a2a;
            color: #f7f1e3;
            font-size: .95em;
            letter-spacing: 0;
            overflow: hidden;
        }
        .seal2 .c1 { grid-area: c1; }
        .seal2 .c2 { grid-area: c2; }
        .seal2 .c3 { grid-area: c3; }
        .seal2 .c4 { grid-area: c4; }
        .seal2 .tight { font-size: .62em; }
        .sig {
            margin-block-start: 1.8em;
            padding-top: 4.4em;
            font-size: .78em;
            color: #8a765a;
            letter-spacing: .12em;
        }
        .sig p { line-height: 2; }
        .seal {
            display: inline-block;
            margin-top: .9em;
            background: #b23a2a;
            color: #f7f1e3;
            font-size: .82em;
            line-height: 1.2;
            height: 2.6em;
            padding: .3em .24em;
            border-radius: .12em;
            letter-spacing: .05em;
            box-shadow: 0 0 0 1px rgba(178, 58, 42, .35);
        }
    </style>
</head>
<body>
    <div class="scroll">
        <div class="stanza">
            <p>一径入云深</p>
            <p>万象秋毫静</p>
            <p>新雨洗空翠</p>
            <p>千峰各自晴</p>
        </div>
        <div class="count">
            <p>足印</p>
            <div class="seal2" id="countSeal" hidden>
                <span class="c1">柒</span>
                <span class="c2" id="sc2"></span>
                <span class="c3">余</span>
                <span class="c4" id="sc4"></span>
            </div>
            <p id="line"></p>
        </div>
        <div class="sig">
            <p>时丙午年夏</p>
            <p>胡邵武偕猫斑斑</p>
            <p>识于沪上<span class="seal">斑斑之印</span></p>
        </div>
    </div>

    <script>
    (function () {
        var lineEl = document.getElementById('line');
        var sealEl = document.getElementById('countSeal');

        function toCn(n) {
            var d = '\u96f6\u4e00\u4e8c\u4e09\u56db\u4e94\u516d\u4e03\u516b\u4e5d';
            var units = ['', '\u5341', '\u767e', '\u5343'];
            var bigs = ['', '\u4e07', '\u4ebf'];
            if (n === 0) return d[0];
            var s = '', i = 0;
            while (n > 0) {
                var seg = n % 10000;
                if (seg > 0) {
                    var segs = '', z = false, m = seg, j = 0;
                    while (m > 0) {
                        var dig = m % 10;
                        if (dig === 0) {
                            if (segs && !z) { segs = d[0] + segs; z = true; }
                        } else {
                            segs = d[dig] + units[j] + segs;
                            z = false;
                        }
                        m = Math.floor(m / 10); j++;
                    }
                    s = segs + bigs[i] + s;
                }
                n = Math.floor(n / 10000); i++;
            }
            return s.replace(/^\u4e00\u5341/, '\u5341');
        }

        function showSeal(n) {
            var e = 0;
            while (Math.pow(7, e + 1) <= n) e++;
            var r = n - Math.pow(7, e);
            var c2 = document.getElementById('sc2');
            var c4 = document.getElementById('sc4');
            c2.textContent = toCn(e);
            c4.textContent = toCn(r);
            if (c2.textContent.length > 1) c2.className = 'c2 tight';
            if (c4.textContent.length > 1) c4.className = 'c4 tight';
            sealEl.hidden = false;
        }

        var forced = parseInt((location.hash || '').slice(1), 10);
        if (!isNaN(forced) && forced > 0) {
            showSeal(forced);
        } else {
            fetch('https://hushaowu.goatcounter.com/counter//hill/.json')
                .then(function (r) { return r.json(); })
                .then(function (d) {
                    var n = parseInt(String(d.count || '0').replace(/[^0-9]/g, ''), 10) + 1;
                    showSeal(n);
                })
                .catch(function () {
                    lineEl.textContent = '\u590d\u6dfb\u4e00\u679a';
                });
        }

        try {
            var img = new Image();
            img.src = 'https://hushaowu.goatcounter.com/count?p=%2Fhill%2F&t=' + encodeURIComponent('\u7ffb\u8fc7\u5c71\u4e18') + '&rnd=' + Math.random();
        } catch (e) {}
    })();
    </script>
</body>
</html>
