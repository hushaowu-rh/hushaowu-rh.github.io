<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>翻过山丘</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Ma Shan Zheng', 'Kaiti SC', 'STKaiti', 'KaiTi', 'Noto Serif SC', serif;
            background: #ead9b8;
            background-image: radial-gradient(ellipse at center, #f5eedd 0%, #e6d2ac 100%);
            color: #3a2f23;
            display: flex;
            overflow: auto;
            font-size: clamp(14px, 3vw, 22px);
        }
        .scroll {
            writing-mode: vertical-rl;
            margin: auto;
            border: 1px solid rgba(155, 84, 63, .55);
            outline: 1px solid rgba(155, 84, 63, .3);
            outline-offset: 5px;
            padding: 2.4em 2em;
            background: rgba(255, 252, 242, .4);
        }
        .stanza p {
            font-size: 1.6em;
            line-height: 1.95;
            letter-spacing: .2em;
        }
        .count {
            margin-block-start: 2em;
            padding-top: 2.2em;
            color: #6b5a41;
            letter-spacing: .15em;
        }
        .count p { font-size: .85em; line-height: 2; }
        .seal2 {
            writing-mode: horizontal-tb;
            display: inline-grid;
            gap: 1px;
            background: #f7f1e3;
            border: 2px solid #b23a2a;
            border-radius: .12em;
            padding: 2px;
            margin: .45em 0;
            box-shadow: 0 1px 2px rgba(90, 40, 20, .25);
            letter-spacing: 0;
            vertical-align: middle;
        }
        .seal2 span {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: #b23a2a;
            color: #f7f1e3;
            font-size: .92em;
            line-height: 1;
        }
        .sig {
            margin-block-start: 1.8em;
            padding-top: 4.4em;
            font-size: .78em;
            color: #8a765a;
            letter-spacing: .12em;
        }
        .sig p { line-height: 2; }
    </style>
</head>
<body>
    <div class="scroll">
        <div class="stanza">
            <p>一径入云深</p>
            <p>万象秋毫静</p>
            <p>岩松含宿雨</p>
            <p>千峰各自晴</p>
        </div>
        <div class="count">
            <p>山径至此</p>
            <p id="countLine">足印凡<span class="seal2" id="countSeal" hidden></span></p>
            <p id="countRem"></p>
        </div>
        <div class="sig">
            <p>时丙午年夏</p>
            <p>胡邵武偕猫斑斑</p>
            <p>识于沪上</p>
        </div>
    </div>

    <script>
    (function () {
        var sealEl = document.getElementById('countSeal');
        var lineEl = document.getElementById('countLine');
        var remEl = document.getElementById('countRem');
        var DIG = '\u96f6\u58f9\u8d30\u53c1\u8086\u4f0d\u9646\u67d2\u634c\u7396'; // 零壹贰叁肆伍陆柒捌玖

        function digitsBig(n) {
            return String(n).replace(/[0-9]/g, function (c) { return DIG[+c]; });
        }

        function buildSeal(n) {
            var e = 0, r = n;
            if (n >= 7) {
                e = Math.floor(Math.log(n) / Math.log(7));
                while (Math.pow(7, e + 1) <= n) e++;
                while (Math.pow(7, e) > n) e--;
                r = n - Math.pow(7, e);
            }
            var es = String(e);
            while (es.length < 3) es = '0' + es;
            var chars = ['\u67d2', DIG[+es[0]], DIG[+es[1]], DIG[+es[2]]];
            sealEl.innerHTML = '';
            sealEl.style.gridTemplateRows = 'repeat(2, 1.15em)';
            sealEl.style.gridTemplateColumns = 'repeat(2, 1.15em)';
            for (var k = 0; k < 4; k++) {
                var cell = document.createElement('span');
                cell.textContent = chars[k];
                var col = Math.floor(k / 2);
                var row = k % 2;
                cell.style.gridColumn = String(2 - col);
                cell.style.gridRow = String(row + 1);
                sealEl.appendChild(cell);
            }
            sealEl.hidden = false;
            remEl.textContent = (r > 0 ? '\u53c8' + digitsBig(r) : '') + '\u679a';
        }

        var forced = parseInt((location.hash || '').slice(1), 10);
        if (!isNaN(forced) && forced > 0) {
            buildSeal(forced);
        } else {
            fetch('https://hushaowu.goatcounter.com/counter//hill/.json')
                .then(function (r) { return r.json(); })
                .then(function (d) {
                    var n = parseInt(String(d.count || '0').replace(/[^0-9]/g, ''), 10) + 1;
                    buildSeal(n);
                })
                .catch(function () {
                    lineEl.textContent = '\u590d\u6dfb\u8db3\u5370\u4e00\u679a';
                });
        }

        try {
            var img = new Image();
            img.src = 'https://hushaowu.goatcounter.com/count?p=%2Fhill%2F&t=' + encodeURIComponent('\u7ffb\u8fc7\u5c71\u4e18') + '&rnd=' + Math.random();
        } catch (e) {}
    })();
    </script>
</body>
</html>
