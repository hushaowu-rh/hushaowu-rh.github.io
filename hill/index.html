<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>翻过山丘</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Georgia', 'Songti SC', 'Noto Serif SC', serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fafafa;
            color: #1a1a1a;
        }
        p { font-size: 1.5em; letter-spacing: 3px; text-align: center; padding: 0 20px; }
        .sig { font-size: 0.8em; color: #bbb; margin-top: 50px; letter-spacing: 2px; }
    </style>
</head>
<body>
    <div>
        <p id="line"></p>
        <p class="sig">胡邵武 偕猫斑斑，识于沪上。时丙午年夏。</p>
    </div>

    <script>
    (function () {
        var el = document.getElementById('line');
        fetch('https://hushaowu.goatcounter.com/counter//hill/.json')
            .then(function (r) { return r.json(); })
            .then(function (d) {
                var n = parseInt(String(d.count || '0').replace(/[^0-9]/g, ''), 10) + 1;
                el.textContent = '\u5c71\u5f84\u81f3\u6b64\uff0c\u8db3\u5370\u51e1 ' + n + ' \u679a\u3002';
            })
            .catch(function () {
                el.textContent = '\u5c71\u5f84\u4e4b\u4e0a\uff0c\u590d\u6dfb\u8db3\u5370\u4e00\u679a\u3002';
            })
            .finally(function () {
                try {
                    var img = new Image();
                    img.src = 'https://hushaowu.goatcounter.com/count?p=%2Fhill%2F&t=' + encodeURIComponent('\u7ffb\u8fc7\u5c71\u4e18') + '&rnd=' + Math.random();
                } catch (e) {}
            });
    })();
    </script>
</body>
</html>
