<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>翻过山丘</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Georgia', 'Songti SC', 'Noto Serif SC', serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fafafa;
            color: #1a1a1a;
        }
        p { font-size: 1.5em; letter-spacing: 3px; text-align: center; padding: 0 20px; }
    </style>
</head>
<body>
    <p id="line"></p>

    <script>
    (function () {
        var el = document.getElementById('line');
        fetch('https://hushaowu.goatcounter.com/counter//hill/.json')
            .then(function (r) { return r.json(); })
            .then(function (d) {
                var n = parseInt(String(d.count || '0').replace(/[^0-9]/g, ''), 10) + 1;
                el.textContent = '\u4f60\u662f\u7b2c ' + n + ' \u4e2a\u5230\u8fbe\u8fd9\u91cc\u7684\u4eba\u3002';
            })
            .catch(function () {
                el.textContent = '\u4f60\u5230\u8fbe\u4e86\u8fd9\u91cc\u3002';
            })
            .finally(function () {
                try {
                    var img = new Image();
                    img.src = 'https://hushaowu.goatcounter.com/count?p=%2Fhill%2F&t=' + encodeURIComponent('\u7ffb\u8fc7\u5c71\u4e18') + '&rnd=' + Math.random();
                } catch (e) {}
            });
    })();
    </script>
</body>
</html>
