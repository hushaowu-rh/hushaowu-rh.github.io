<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>翻过山丘</title>
    <script>
    (function () {
        if (!window.matchMedia || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        document.documentElement.classList.add('ink-pending');
        // Keep the complete page readable if animation setup is interrupted.
        window.hillInkFallback = setTimeout(function () {
            document.documentElement.classList.remove('ink-pending');
        }, 1800);
    })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Ma Shan Zheng', 'Kaiti SC', 'STKaiti', 'KaiTi', 'Noto Serif SC', serif;
            background: #ead9b8;
            background-image: radial-gradient(ellipse at center, #f5eedd 0%, #e6d2ac 100%);
            color: #3a2f23;
            display: flex;
            overflow: auto;
            font-size: clamp(14px, 3vw, 22px);
        }
        .scroll {
            writing-mode: vertical-rl;
            margin: auto;
            border: 1px solid rgba(155, 84, 63, .55);
            outline: 1px solid rgba(155, 84, 63, .3);
            outline-offset: 5px;
            padding: 2.4em 2em;
            background: rgba(255, 252, 242, .4);
        }
        /* Five characters plus spacing reserve the poem's height before font loading. */
        .stanza { inline-size: 9.6em; }
        .stanza p {
            font-size: 1.6em;
            line-height: 1.95;
            letter-spacing: .2em;
            white-space: nowrap;
        }
        .count {
            margin-block-start: 2em;
            padding-top: 2.2em;
            color: #6b5a41;
            letter-spacing: .15em;
        }
        .count p { font-size: .85em; line-height: 2; }
        /* A real line box reserves the same column before the count arrives. */
        #countRem::before { content: '\00a0'; }
        #countRem { position: relative; }
        #countValue {
            position: absolute;
            inset-block-start: 0;
            inset-inline-start: 0;
            white-space: nowrap;
            transform-origin: top right;
        }
        /* Two stamp cells, one gap, and the existing padding and border. */
        #countLine { min-block-size: calc(2.3em + 9px); }
        .seal2 {
            position: relative;
            writing-mode: horizontal-tb;
            display: inline-grid;
            grid-template-rows: repeat(2, 1.15em);
            grid-template-columns: repeat(2, 1.15em);
            gap: 1px;
            background: #f7f1e3;
            border: 2px solid #b23a2a;
            border-radius: .12em;
            padding: 2px;
            margin: .45em 0;
            box-shadow: 0 1px 2px rgba(90, 40, 20, .25);
            letter-spacing: 0;
            vertical-align: middle;
        }
        /* Keep the stamp's final footprint while its count is loading. */
        .seal2[hidden] { visibility: hidden; }
        .seal2 span {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: #b23a2a;
            color: #f7f1e3;
            font-size: .92em;
            line-height: 1;
        }
        .sig {
            margin-block-start: 1.8em;
            padding-top: 4.4em;
            font-size: .78em;
            color: #8a765a;
            letter-spacing: .12em;
        }
        .sig p { line-height: 2; }
        .ink-pending .stanza,
        .ink-pending .count,
        .ink-pending .sig { visibility: hidden; }
        .ink-running .ink-char {
            animation: write-ink var(--ink-duration, .7s) linear both;
            animation-delay: var(--ink-delay);
        }
        .ink-running .ink-horizontal { animation-name: write-horizontal; }
        .ink-running .count {
            animation: settle-ink .55s ease-out both;
            animation-delay: var(--count-delay);
        }
        .seal-waiting { opacity: 0; }
        .seal-stamping {
            transform-origin: center;
            animation: stamp-ink 1.2s ease-out both;
        }
        .seal-stamping::after {
            content: '';
            position: absolute;
            inset: -2px;
            border: 1px solid #b23a2a;
            border-radius: inherit;
            pointer-events: none;
            animation: stamp-contact .65s .56s ease-out both;
        }
        @keyframes write-ink {
            from { opacity: 0; clip-path: inset(0 0 100% 0); filter: blur(.35px); }
            8% { opacity: 1; clip-path: inset(-.15em -.15em 86% -.15em); }
            28% { clip-path: inset(-.15em -.15em 64% -.15em); }
            48% { clip-path: inset(-.15em -.15em 51% -.15em); }
            76% { clip-path: inset(-.15em -.15em 22% -.15em); filter: blur(.15px); }
            94% { clip-path: inset(-.15em); filter: blur(0); }
            to { opacity: 1; clip-path: none; filter: none; }
        }
        /* A horizontal stroke must grow left to right, rather than appear in one strip. */
        @keyframes write-horizontal {
            from { opacity: 0; clip-path: inset(-.15em 100% -.15em -.15em); filter: blur(.35px); }
            12% { opacity: 1; clip-path: inset(-.15em 85% -.15em -.15em); }
            38% { clip-path: inset(-.15em 60% -.15em -.15em); }
            74% { clip-path: inset(-.15em 22% -.15em -.15em); filter: blur(.15px); }
            94% { clip-path: inset(-.15em); filter: blur(0); }
            to { opacity: 1; clip-path: none; filter: none; }
        }
        @keyframes settle-ink {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes stamp-ink {
            from { opacity: 0; transform: translate(-.08em, -.65em) scale(1.18) rotate(-8deg); filter: blur(1.1px); }
            26% { opacity: .48; transform: translate(-.04em, -.35em) scale(1.1) rotate(-5deg); filter: blur(.65px); }
            46% { opacity: .82; transform: translate(0, -.08em) scale(1.03) rotate(-1deg); filter: blur(.2px); }
            55% { opacity: 1; transform: translate(.01em, .025em) scale(.97) rotate(.4deg); filter: contrast(1.25) saturate(1.15); }
            72% { transform: none; filter: contrast(1.12) saturate(1.05); }
            to { opacity: 1; transform: none; filter: none; }
        }
        @keyframes stamp-contact {
            from { opacity: 0; transform: scale(.97); }
            12% { opacity: .28; }
            to { opacity: 0; transform: scale(1.12); }
        }
        @media (prefers-reduced-motion: reduce), print {
            .ink-pending .stanza,
            .ink-pending .count,
            .ink-pending .sig { visibility: visible; }
            .ink-running .ink-char,
            .ink-running .count,
            .seal-stamping { animation: none; }
            .seal-waiting { opacity: 1; }
            .seal-stamping::after { display: none; }
        }
    </style>
</head>
<body>
    <div class="scroll">
        <div class="stanza">
            <p>一径入云深</p>
            <p>万象秋毫静</p>
            <p>岩松含宿雨</p>
            <p>千峰各自晴</p>
        </div>
        <div class="count">
            <p>山径至此</p>
            <p id="countLine">足印凡<span class="seal2" id="countSeal" hidden></span></p>
            <p id="countRem"><span id="countValue"></span></p>
        </div>
        <div class="sig">
            <p>时丙午年夏</p>
            <p>胡邵武偕猫斑斑</p>
            <p>识于沪上</p>
        </div>
    </div>

    <script>
    (function () {
        var sealEl = document.getElementById('countSeal');
        var lineEl = document.getElementById('countLine');
        var remEl = document.getElementById('countRem');
        var valueEl = document.getElementById('countValue');
        var DIG = '\u96f6\u58f9\u8d30\u53c1\u8086\u4f0d\u9646\u67d2\u634c\u7396'; // 零壹贰叁肆伍陆柒捌玖

        function digitsBig(n) {
            return String(n).replace(/[0-9]/g, function (c) { return DIG[+c]; });
        }

        function fitRemainder() {
            // Long counts stay inside their reserved column instead of resizing the scroll.
            valueEl.style.transform = '';
            var height = valueEl.getBoundingClientRect().height;
            var available = remEl.getBoundingClientRect().height;
            if (height > available) {
                valueEl.style.transform = 'scale(' + (available / height) + ')';
            }
        }

        function buildSeal(n) {
            var e = 0, r = n;
            if (n >= 7) {
                e = Math.floor(Math.log(n) / Math.log(7));
                while (Math.pow(7, e + 1) <= n) e++;
                while (Math.pow(7, e) > n) e--;
                r = n - Math.pow(7, e);
            }
            var es = String(e);
            while (es.length < 3) es = '0' + es;
            var chars = ['\u67d2', DIG[+es[0]], DIG[+es[1]], DIG[+es[2]]];
            sealEl.innerHTML = '';
            for (var k = 0; k < 4; k++) {
                var cell = document.createElement('span');
                cell.textContent = chars[k];
                var col = Math.floor(k / 2);
                var row = k % 2;
                cell.style.gridColumn = String(2 - col);
                cell.style.gridRow = String(row + 1);
                sealEl.appendChild(cell);
            }
            sealEl.hidden = false;
            valueEl.textContent = (r > 0 ? '\u53c8' + digitsBig(r) : '') + '\u679a';
            fitRemainder();
            document.dispatchEvent(new Event('hill:count-ready'));
        }

        var forced = parseInt((location.hash || '').slice(1), 10);
        if (Number.isSafeInteger(forced) && forced > 0) {
            buildSeal(forced);
        } else {
            fetch('https://hushaowu.goatcounter.com/counter//hill/.json')
                .then(function (r) { return r.json(); })
                .then(function (d) {
                    var n = parseInt(String(d.count || '0').replace(/[^0-9]/g, ''), 10);
                    if (!Number.isSafeInteger(n) || n < 0 || n >= Number.MAX_SAFE_INTEGER) {
                        throw new Error('Invalid visitor count');
                    }
                    buildSeal(n + 1);
                })
                .catch(function () {
                    lineEl.textContent = '\u590d\u6dfb\u8db3\u5370\u4e00\u679a';
                });
        }

        window.addEventListener('resize', fitRemainder);
        if (document.fonts) document.fonts.ready.then(fitRemainder);

        try {
            var img = new Image();
            img.src = 'https://hushaowu.goatcounter.com/count?p=%2Fhill%2F&t=' + encodeURIComponent('\u7ffb\u8fc7\u5c71\u4e18') + '&rnd=' + Math.random();
        } catch (e) {}
    })();
    </script>
    <script>
    (function () {
        var root = document.documentElement;
        if (!root.classList.contains('ink-pending')) return;
        var motion = window.matchMedia('(prefers-reduced-motion: reduce)');
        var seal = document.getElementById('countSeal');
        var finishTimer;
        var stampTimer;
        var writingDone = false;
        var cancelled = false;
        var stamped = false;
        var delay = 240;

        function prepareLines(selector, duration, gap, pause) {
            var lastEnd = delay;
            document.querySelectorAll(selector).forEach(function (line) {
                var text = line.textContent;
                var fragment = document.createDocumentFragment();
                Array.from(text).forEach(function (character) {
                    // Ordinary inline spans preserve the original vertical typesetting.
                    var span = document.createElement('span');
                    span.className = 'ink-char' + (character === '一' ? ' ink-horizontal' : '');
                    span.textContent = character;
                    span.style.setProperty('--ink-duration', duration + 'ms');
                    span.style.setProperty('--ink-delay', delay + 'ms');
                    fragment.appendChild(span);
                    lastEnd = delay + duration;
                    delay = lastEnd + gap;
                });
                line.textContent = '';
                line.appendChild(fragment);
                delay += pause;
            });
            return lastEnd;
        }

        function clearStamp() {
            clearTimeout(stampTimer);
            if (seal) seal.classList.remove('seal-waiting', 'seal-stamping');
        }

        function cancel() {
            cancelled = true;
            clearTimeout(window.hillInkFallback);
            clearTimeout(finishTimer);
            root.classList.remove('ink-pending', 'ink-running');
            clearStamp();
        }

        function maybeStamp() {
            if (cancelled || stamped || !writingDone || !seal || !seal.isConnected || seal.hidden) return;
            stamped = true;
            seal.classList.remove('seal-waiting');
            seal.classList.add('seal-stamping');
            stampTimer = setTimeout(clearStamp, 1250);
        }

        function finishWriting() {
            writingDone = true;
            root.classList.remove('ink-running');
            maybeStamp();
        }

        // Each character finishes before the next begins; pauses mark the column changes.
        delay = prepareLines('.stanza p', 700, 160, 500) + 260;
        root.style.setProperty('--count-delay', delay + 'ms');
        delay += 870;
        delay = prepareLines('.sig p', 340, 100, 250) + 350;

        function start() {
            if (!root.classList.contains('ink-pending') || motion.matches) {
                cancel();
                return;
            }
            clearTimeout(window.hillInkFallback);
            if (seal) seal.classList.add('seal-waiting');
            root.classList.add('ink-running');
            root.classList.remove('ink-pending');
            finishTimer = setTimeout(finishWriting, delay);
        }

        // Wait briefly for the calligraphy font, without making a slow network block reading.
        Promise.race([
            document.fonts ? document.fonts.ready : Promise.resolve(),
            new Promise(function (resolve) { setTimeout(resolve, 700); })
        ]).then(start).catch(cancel);
        // Count data can arrive before or after the poem. Start the impression only when ready.
        document.addEventListener('hill:count-ready', maybeStamp);
        motion.addEventListener('change', function () { if (motion.matches) cancel(); });
        window.addEventListener('pagehide', cancel);
    })();
    </script>
</body>
</html>
