<script id="chapter-data" type="application/json">[{"id":1,"label":"第一章","title":"引言","description":"图案、循环与记录，建立质量和力的共同起点","duration":340.479329,"mb":3.2,"video":"https://hushaowu-rh.github.io/videos/paper16-ch1/video.mp4","poster":"https://hushaowu-rh.github.io/videos/paper16-ch1/poster.jpg","page":"https://hushaowu-rh.github.io/videos/paper16-ch1/","source_sha256":"12bfb282f2559ff3fc5e66248ff81d1cfb72d0324a5542147821b9a4381b9dc0","segments":[{"time":0.0,"title":"质量与力，从什么对象出发","narration":["我们怎样从同一个过程理解物质的质量与相互作用？这篇论文把目光放在稳定态与背景的交换上。","Bost–Connes系统联系数论的乘法结构与量子统计的时间演化。本文从有限p进约化态空间出发，在已有联合循环的基础上，研究不同激发怎样成为具体的物质读数。","先看激发是什么图案，再追踪它怎样返回、怎样离开，以及这些过程如何留下可以比较的记录。"]},{"time":36.708333333333336,"title":"稳定，首先指图案保持","narration":["背景提供辨认图案的参照。在各个位置画一支箭头，长度表示振幅大小，方向表示相位。所有箭头的相对关系，共同组成一个激发图案。","给定传播若使每一支箭头都乘以同一个非零复数，整幅图案就只发生共同缩放和旋转。各位置之间的相对幅度与相位保持不变，这就是这里的稳定态。","形态保持与持续份额分别描述。返回分量可以越来越少，却仍然保持同一图案；实际交换后的返回是否保形，还要用完整作用检查。"]},{"time":80.58333333333334,"title":"同一激发走完一轮","narration":["完整循环从自由演化开始，激发积累相位。随后，它与背景发生形成交换，原有激发可以返回，也可以转入背景。","背景也能形成新激发。返回部分、新形成部分和恢复后的背景，一起构成联合末态。图案重建展示这份末态的位置分布及相干关系。","重建本身不另添一次物理作用，也不增加时长。联合末态的系统部分接续下一轮，循环由此持续推进。"]},{"time":118.625,"title":"延续与新形成分别计入","narration":["设想一轮结束后，系统里仍然有激发。它可能是原来的激发返回，也可能是背景形成的一个新激发。这两条历史承担不同的物理问题。","连续维持追踪原有激发的返回；形成追踪从背景新增的部分。原激发退出到背景，在这个循环中称为衰变或退出。","具体粒子衰变成什么，仍要接到相应的物理表示与实际输出。把身份和份额分开，后面才能比较质量、形成和寿命。"]},{"time":157.20833333333334,"title":"运动从分布怎样变化来读","narration":["同一循环也给运动提供观察依据。比较不同时刻的末态位置分布，看激发在各个位置上的读出份额怎样变化。","这份分布与相位、交换和返回来自同一个联合过程。物理位置再通过实际指针来标定。","多轮迭代还决定总体状态怎样变化。在满足相应的收敛与Gibbs条件时，它趋向热平衡。运动、形成、退出与热化，因而可以放在共同循环中研究。"]},{"time":193.125,"title":"记录保存在系统内部","narration":["如果两条过程的区别在一轮结束后仍由环境或辅助保存，并且在所讨论的后续演化中继续保持，就有了记录的载体。","当这些记录能由正交指针区分时，实际读出就把过程区别变成可比较的事件。参照、环境、辅助和记录，都属于联合态空间内部。","事件取得多少份额，要从实际输出计算。这样，记录不会脱离产生它的传播与交换。"]},{"time":228.33333333333334,"title":"循环次数与记录次数分别计算","narration":["屏幕上画出八轮连续循环，但只在其中两轮标出我们选定类别的记录。两次记录之间，系统仍然继续演化。","所以一次循环不自动等于一次所选事件。记录之间的等待时间可以跨过多轮；其他类别的事件也可能发生。","区分这两种计数，才能把循环速率、事件频率和实际历时接在一起，而不把它们提前当成同一个量。"]},{"time":261.9166666666667,"title":"二维观测单元怎样给出四个实分量","narration":["在非零位置上，取负对合把a和负a组成一个点对。位置区分配合这项对合，给出一个二维复观测单元。","这个单元上的自伴矩阵，有两个实对角分量，以及一对互为共轭的非对角分量。一个复数含两个实数，因此一共是四个实分量。","它们提供后文所用的观测几何。实际时间仍由过程历时确定，实际位置仍由指针标定；几何结构与物理读数由这些连接相接。"]},{"time":299.1666666666667,"title":"质量、相互作用与求值连成主线","narration":["现在，质量和力的问题可以落到同一个对象上。第一，什么持续读数表征质量，不同图案为什么产生不同频率？","第二，完整载体通过哪些端点交换，作用的方式、强弱与范围由什么决定？第三，路径、参与份额和共同标定，怎样进入质量及耦合的计算？","奇素数p所标记的稳定态结构，连同形成和交换过程，给出求值依据。接下来的第二章从稳定态展开，逐步把这条主线具体建立起来。"]}]},{"id":2,"label":"第二章","title":"稳定态","description":"形成与维持、持续频率、共同能标","duration":544.645996,"mb":5.4,"video":"https://hushaowu-rh.github.io/videos/paper16-ch2/video.mp4","poster":"https://hushaowu-rh.github.io/videos/paper16-ch2/poster.jpg","page":"https://hushaowu-rh.github.io/videos/paper16-ch2/","source_sha256":"12bfb282f2559ff3fc5e66248ff81d1cfb72d0324a5542147821b9a4381b9dc0","segments":[{"time":0.0,"title":"什么能够持续存在？","narration":["什么样的图案，能够成为持续存在的物质？新版十六的第二章，从这个问题出发。","设想每个地址都有一支小箭头。箭头长度表示振幅大小，方向表示相位。","一次响应之后，所有箭头可以共同转动、同比缩放。如果归一后仍是原来的排列，图案就保持了。","这是本章的谱稳定判据。它还需要接上实际形成、持续作用，以及退出的过程。"]},{"time":35.0,"title":"图案住在哪里？","narration":["本章采用一个有限地址空间。每个地址携带复振幅，全部振幅一起组成状态。","地址按照能被素数整除多少次，分成不同的算术壳；零元另占一个位置。","单位壳的平均态、完整空间的共同背景、零元，属于不同对象。后面的形成与返回，必须说明实际接到了哪一个。"]},{"time":63.08333333333333,"title":"相同概率，不同图案","narration":["基本态的例子来自乘法特征标。它把地址相乘，变成对应相位相加。","看这两排箭头：每个地址上的长度相同，因此位置概率完全一样；但相位排列不同。","传播的谱响应能够区分这种整体排列。种类信息在相位关系中，单看局部概率还不够。","这里用七这个素数作图示，并不把所有可能模式都等同于已列出的物质种类。"]},{"time":96.33333333333333,"title":"整体也可以成为图案","narration":["另一类结构来自整个空间共同同相的背景。它横跨多个算术壳，构成集体图案。","各壳占了多少份额，与各壳之间是否保持相干，是两个问题。","如果环境留下能够区分各壳的信息，约化后的相干就会减弱。相同的份额，未必是同一个纯图案。","所以，集体态需要追踪跨壳相干怎样随实际过程保留下来。"]},{"time":128.45833333333331,"title":"形成：建立共同相位","narration":["接下来追踪形成。本章的基本族例子，让单位壳背景与一对共轭方向建立相干。","热交换提供形成和退出的通道；相位对齐与反馈，把允许输入交付到共同的形成源。","输入之间原有的区别，由保留的记录承接。这些记录仍在完整过程里。","在这套指定准备中，背景和共轭对得到等幅叠加。只有普通热恢复，还不会自动得到这样的纯图案。"]},{"time":163.66666666666666,"title":"代间份额怎样出现？","narration":["把形成源按位置组展开，背景与共轭方向会在每一组发生干涉。","有的组振幅相加，有的组几乎抵消；取模平方后，就得到不同的整组份额。","画面比较不同形成相位。一个共同相位参数，改变全部组的分配，而份额总和保持为一。","这解释了代间差异能够从同一形成图案读出。此时份额还是源的结构，尚须进入后续实际作用。"]},{"time":198.25,"title":"一次修饰，两种作用","narration":["形成修饰通过实际去返，使两个共轭方向得到相反相位，辅助随后复归。","维持时，同一套修饰还能改变持续作用的强度。但形成偏角与频率缩减，需要分别计算。","在本稿指定的中继、准备和相关条件下，两处由同一个修正量联系起来。","其中形成总作用量仍要按采用的一次核过程计入。一次整体相位，不能直接当成持续频率。"]},{"time":233.79166666666666,"title":"保持载体，继续作用","narration":["形成源还要继续参与交换。源、目标与必要辅助，共同组成持续载体。","本章给出两条同时作用的相干臂。它们朝载体外的振幅贡献相消，载体内的作用却保留下来。","注意，画面表示同时相消，并不是先泄漏，再把物质拉回来。","两条等强作用臂同时运行，使载体在全部时间内保持，内部状态持续积累相位。"]},{"time":267.75,"title":"形成、存续、相位","narration":["还没准备好的输入，可以在运行中逐轮修复。允许域内，未就绪部分逐渐减少，存续部分趋近持续演化的轨道。","与此同时，原激发也可能退出。形成收敛、存续包络和内部相位，各有自己的读数。","退出后重新形成的激发，要开启新的历史。总体占据保持，不意味着每一个对象永远存在。","本章把这三件事放进同一循环；实际衰变产物和各代寿命，还需要相应退出通道。"]},{"time":307.7083333333333,"title":"路径留下什么？","narration":["质量计算从实际路径出发。一次谱访问的振幅，必须连同容量归一和失败输出一起计算。","在所用的共轭双访问中，指定共同成功端的幅度带上谱值模方；其效应再平方，出现四次方。完整谱辅助继续参与维持。","多条路径如何合并，也取决于记录。如果完整输出相同，可以相干叠加；若记录可区分，就必须保留对应的概率与相干信息。"]},{"time":343.375,"title":"节点与份额接入交换","narration":["路径经过节点时，实际准备和端口重叠决定节点因子。根号二分之一，必须在具体连接中出现。","目标再与形成源作同组匹配。在同一个源上计算实际矩阵元，各组的持续作用便带上对应份额。","这样，路径因子、节点因子和代间份额，都进入同一个载体上的生成元。它们在过程中的位置，也随之明确了。"]},{"time":375.875,"title":"质量怎样被读出？","narration":["持续作用让相位积累。质量读数来自相对于零点参照的静止频率，单独的整体相位不可读。","若比较正负两支，拍频是质量频率的两倍，质量取静止半能隙。","计时必须包含活动、处理和等待。若所讨论的相位只在活动段积累，读出的频率就带上活动时间份额。","存续概率决定还有多少原激发留下；它并不直接乘进存续者的质量。"]},{"time":410.0833333333333,"title":"同一参数，也控制惯性","narration":["再让同一个载体通过共享运动端口传播。能量分支在零动量处的半能隙，由这个相位参数决定。","靠近零动量，曲线的弯曲程度给出惯性响应；它仍由同一个参数控制。","因此，质量在候选内部获得了运动学含义。这里展示的是原点和长波结论，不能把有限格点的整条色散都直接当成连续相对论。"]},{"time":441.04166666666663,"title":"共同能标先数什么？","narration":["绝对能标还要看，实际有多少模式参与，以及它们各自带着多少正权重。","一个完整相干图案可以是一条纯态方向，却涉及许多参与地址。这两个计数不能混用。","当前稿保留权重总量，再采用对数形式的共同响应，计算平方响应。","把所有权重重新归一成一，会删掉真实的标度信息。因此这里不能只看归一后的状态。"]},{"time":474.66666666666663,"title":"物质与背景共用标尺","narration":["让物质端与背景标定，经过同一个形成源。物质端读出本组份额，背景端读出参照组份额。","两侧共用保护和计时后，比较响应出现本组与参照组的比值。这是画面所示可因子化基本族的结果。","再按采用的背景平方匹配，获得共同质量标尺。实际参与权重、响应规则和物理能量单位，仍须明确承接。","中性链保留非对角矩阵，集体态另接相干返回。共同能标也不是每秒循环多少次。"]},{"time":515.7916666666666,"title":"从图案，走到质量","narration":["回看整章：谱响应说明什么图案能够保持；相干形成建立实际源；完整载体让它持续参与交换。","路径、节点和整组份额进入相位，完整计时与共同背景把相位变成质量读数。","在本章给出的准备与交换中，形成、维持、相位读出和背景标定接成同一个质量过程。"]}]},{"id":3,"label":"第三章","title":"共振力","description":"共同方向与端点交换，作用怎样发生","duration":695.229329,"mb":6.6,"video":"https://hushaowu-rh.github.io/videos/paper16-ch3/video.mp4","poster":"https://hushaowu-rh.github.io/videos/paper16-ch3/poster.jpg","page":"https://hushaowu-rh.github.io/videos/paper16-ch3/","source_sha256":"12bfb282f2559ff3fc5e66248ff81d1cfb72d0324a5542147821b9a4381b9dc0","segments":[{"time":0.0,"title":"稳定态怎样相互影响？","narration":["第二章追踪一个稳定态怎样形成、维持，并积累可读的相位。第三章把两个这样的循环连接起来。","一方释放的激发，进入共同环境，再到达另一方的实际入口。两个稳定态的变化，由此相互关联。","本章把这种由方向响应与实际交换承载的作用，称为共振力。我们沿着一条传递过程，看看通道、耦合和修正各自从哪里出现。"]},{"time":33.666666666666664,"title":"先找到共同方向","narration":["发射端和吸收端，首先要能够接入同一个谱方向。这个方向经过所选响应段，仍保持原来的相位排列，只乘上一个复系数。","因此，谱结构告诉我们，什么图案能够在两端之间衔接。","实际传递还要满足能量、群荷和时序中的相位条件。如果发射顶点关闭，即使共同方向存在，转移概率仍然是零。"]},{"time":65.45833333333333,"title":"一个中继，两个顶点","narration":["最小例子只有三个联合状态：激发留在甲端，暂存在中继，以及到达乙端。","第一次交换给出发射振幅，传播带来相位，第二次交换给出吸收振幅。三项相乘，得到完成传递的振幅。","输出同时保留未发射和未吸收的分量，三个结果的概率之和为一。","单条路径里的传播相位不改变概率；有通向同一结果的其他相干路径时，相对相位才进入干涉。"]},{"time":102.16666666666666,"title":"交换之后，完整取回","narration":["持续载体包含形成源、目标状态、辅助和旧记录。相互作用要真正接触目标，同时保持两端所用的源和辅助。","本章给出一个三段过程：先把甲端逻辑状态暂存中继，再与乙端部分交换，最后逆向取回。","中继对全部逻辑输入都恢复原准备，两端目标则可以形成纠缠。图中的零和一是两个逻辑模式，零不表示物质退出。","共同保护保持两端的源和辅助，三段操作与额外处理一起计入完整历时。"]},{"time":144.16666666666666,"title":"怎样把交换读成力？","narration":["交换完成后，完整输出决定能够读到什么。实际指针保存的区别，给出事件概率。","在重复过程中，平均事件次数除以实际时间，得到计数率。稳定态自身还可以表现出相位、位置或动量的改变。","只有建立动量标定，并把开交换与关交换作同条件比较，动量变化除以历时才成为平均机械力。","所以，响应系数、一次概率和每秒发生多少次，分别占据这条过程的不同位置。"]},{"time":183.79166666666666,"title":"通道改变哪部分标签？","narration":["种类标签可以按照互素因子，排成多个坐标。画面用二乘三的六个标签作示例。","一次转移可以改变一个坐标，也可以改变多个坐标。守恒要求系统与环境的总变化配平。","本章采用一次只作用于一个因子的有效步长，将复杂变化组织成逐因子的路径。","这个步长规则需要实际顶点实现。即使局部标签操作对易，共用环境的完整交换也未必能够颠倒顺序。"]},{"time":220.29166666666666,"title":"从通道看到对称结构","narration":["如果容许每个因子内部作酉变换，就得到各个特殊酉因子，以及一个共同的中心相位。","它描述保因子变换的范围。要成为固定响应的对称，还必须保持原来的谱作用；只有相同复本征值的方向，才能在这种对称下混合。","中心相位也需要整体内部的相干参照，才能变成可读的相对相位。","因此，把这些结构对应到独立作用力，还要逐一接上交换、读出与独立性。"]},{"time":257.54166666666663,"title":"耦合的分母从哪里来？","narration":["先固定谱参照，再考察一个实际顶点。假设准备包含若干正交、等权的备选，顶点只接受其中一个归一方向。","匹配份额便是备选数的倒数。再乘上方向响应的模方，就得到画面中的裸耦合。","备选数按核、点对组和取向计数，要求这些标签确有独立的物理承载。","尤其是两个取向，必须真有两份备选，才能计成二；同一完整状态的两种写法不能重复计数。"]},{"time":295.7083333333333,"title":"同一个谱，准备可以不同","narration":["在同一谱响应赋值下，把准备和匹配方向推广，就得到：谱响应模方，乘以准备落进匹配空间的份额。","已经对准的纯态，匹配份额为一；完全正交的输入，份额为零。匹配方向增加，接受的总份额也会改变。","热平衡在等能块内可以实现等权，但不会自动抹平不同能量和不同顶点的差别。","这也说明，耦合不能只从标签个数推出，还要知道实际如何准备、匹配和比较。"]},{"time":335.5833333333333,"title":"谱份额进入了哪一步？","narration":["同一个谱份额，进入不同的实际作用，会产生不同读数。","在前面的持续交换中，它作为生成元的系数，乘上强度和时长，形成交换角；最后概率是这个角的正弦平方。","在另一个一次接受仪器中，谱响应直接进入接受振幅，概率按相应效应计算。接受作用还要补齐其余结果，使完整仪器的总概率为一。","所以，把谱权重接入动力学，关键是写清它处在算子的哪里。只看最后出现同一个符号，还不能认作同一个过程。"]},{"time":379.29166666666663,"title":"返回以后，记录还在吗？","narration":["激发可以直接到达末端，也可以先离开、再返回。正文把未作为独立终止事件读出的中间往返，称为虚过程。","两条路径的系统末态相同，还要检查环境。如果环境末态也相同，两条振幅相干相加；如果记录正交，相应概率相加。","部分重叠则保留部分干涉。系统回来了，并不保证环境已经忘记它曾经离开。","因此，实际记录决定修正怎样合成，而不是只数经过几个顶点。"]},{"time":418.9583333333333,"title":"有效分母是一份权重比","narration":["在一种明确情形中，中间作用改变准备，但响应算子和匹配方向保持不变。","有效分母，就是总准备权重，除以匹配端点的权重。这个比值描述，实际有多少准备能够进入所选响应。","它一般不再是整数。匹配份额增大，分母减小；其他权重相对增大，分母就变大。","若修正还改变了顶点或相干路径，就必须重算完整响应。一个一阶展开，也不能自动当作有限修正的精确公式。"]},{"time":459.4583333333333,"title":"反复往返怎样求和？","narration":["如果不同次数的往返，在最后仍不可区分，就把每次重复看成一个振幅作用。所有长度相加，形成画面中的逆算子。","这个结果要求重复作用的谱半径小于一，保证级数收敛。","如果各次中间结果已经留下正交记录，则要按完整的条件作用，合计不同结束历史的概率。","交替级数中的负号，也必须来自实际进入和读出的模式。最后若要求计数率，还要把各条历史的耗时算进去。"]},{"time":498.375,"title":"集体图案怎样参与交换？","narration":["对涌现态，本章继续使用同样的振幅与记录规则。集体图案相对于自身谱参照，响应因子是一。","这不意味着所有交换都没有额外因子。例如经过零元入口进入一个基本方向，顶点会抽取集体图案在零元上的分量。","画面中的模方因此带上深度相关的份额。实际概率还要接上准备、交换和能量配平。","集体图案的平凡标签，也不能单独说明它在完整循环中具有零频率。"]},{"time":536.4583333333334,"title":"操作个数不等于响应权重","narration":["平移和缩放组织出仿射操作。设素数为 p，有 p 种平移、p 减一种缩放；两者相乘，就是操作的总数。","在深度二的单位地址上，不同操作仍可保持同一个均匀输入；选定点态时，则可以得到彼此不同的地址输出。","只有实际完整输出正交时，总强度才等于逐通道权重之和。","于是，关键量是每条真实路径的系数。用归一概率随机选择更多标签，并不会自动让总响应增加。"]},{"time":576.8333333333334,"title":"层结构确定什么？","narration":["正文还分析了一条具有素数个层次的代数结构。它能严格确定，各个标签在给定节点处方里出现多少次。","但这些层标签，并不是已经发生的量子传播过程。节点取什么值、层间怎样复合，仍要有实际作用承接。","在指定赋权下，总通道权重可写成操作数除以层因子。改变的是响应权重，操作的整数个数没有变化。","同一总权重用于集体和混合过程，还要求两者具有对应的实际入口和逐路系数。"]},{"time":618.3333333333334,"title":"两类响应，共用一份权重","narration":["把实际通道权重算清，便能比较两类交换。集体与集体之间，取相对于集体参照的谱因子一；集体与基本方向之间，取对应的谱响应比。","如果两类过程具有同一总通道权重，并各自采用匹配输入，就得到画面中的两式。","混合过程若另有零元入口、方向筛选或不同环境，必须重新计算它自己的通道权重。","这里的耦合是响应比，可以大于一；实际事件概率还要经过统一标定，并补齐完整结果。"]},{"time":660.375,"title":"从共同通道到可读作用","narration":["把第三章连起来看：谱方向提供衔接，实际顶点完成交换，取回与记录决定哪些路径还能够干涉。","准备和匹配确定响应份额，中间往返给出修正，集体过程则合计真实通道的权重。","最后，通过同一个参照和完整计时，得到事件、计数率或动量响应。","后面的章节沿这些交换过程确定各类作用的物理对应，并计算耦合强度。"]}]},{"id":4,"label":"第四章","title":"度量力","description":"能量响应、观测几何与运动","duration":782.645996,"mb":7.2,"video":"https://hushaowu-rh.github.io/videos/paper16-ch4/video.mp4","poster":"https://hushaowu-rh.github.io/videos/paper16-ch4/poster.jpg","page":"https://hushaowu-rh.github.io/videos/paper16-ch4/","source_sha256":"12bfb282f2559ff3fc5e66248ff81d1cfb72d0324a5542147821b9a4381b9dc0","segments":[{"time":0.0,"title":"度量力：能量怎样产生响应","narration":["同一个稳定态，处在不同的位置，能量可以不同。这种差异怎样成为实际作用？第四章围绕这个问题，把位置、能量和循环连起来。","我们先建立位置读数，再计算谱势差，随后把势接进已有的运动机制。最后，考察物质怎样改变背景，以及背景的共同能标。","我们将计算物质对背景的更新，并考察它与测试载体返回相位的连接。"]},{"time":34.25,"title":"一个观测单元，四个实分量","narration":["先取一对互为相反数的非零地址。它们组成一个二维观测单元，自伴算子可以分解成单位矩阵和三个泡利矩阵。","这给出四个实分量：一个标量分量，以及三个空间方向的分量。四维结构从这个观测单元中出现，整体态空间仍然保留原来的维数。","画面里的四条坐标，表示同一个矩阵的四个分量；它们怎样成为物理的时间和长度，还需要相应的标定。"]},{"time":69.83333333333334,"title":"正性确定几何的光锥","narration":["矩阵的两个本征值，是标量分量加上或减去空间向量的长度。要求矩阵为正，就得到未来锥。行列式相应给出一正三负的几何形式。","在论文规定的零锥和归一条件下，这个二次型被确定。但若矩阵表示某个块的状态，标量分量只是这个块占据份额的一半。","实际经过多久，仍由完整循环的次数和每轮时间计算。几何标架的变换，也要与系统真正的时间演化分开。"]},{"time":107.75,"title":"位置由对数参照读出","narration":["选定非零地址的整数代表和一个参照点，就可以用地址比值的对数来定义位置读数。改变参照点，只让所有读数加上同一个常数。","因此，一到二和二到四，在这种读数下有相同的距离。整数刻度被重新展开成对数刻度，倍数关系变成可加的间隔。","零元不能代入对数，必须单独记录。有限地址绕回以后，整数代表也会改变，不能无条件沿用普通对数的乘法公式。"]},{"time":145.33333333333334,"title":"壳能量与对数势各有作用","narration":["原来的自由能量按壳层编号计算；对数势则读取整个整数地址。一个地址包含壳层部分，也包含单位部分，两者都可能进入对数间隔。","例如在奇素数的单位壳中，一和二的壳能量都是零，但它们的对数间隔并不为零。这个简单例子说明，两种能量不能直接互换。","只有整数单位部分相同、并且没有绕回时，对数间隔才等于壳能量差。接下来让对数势参与运动，是一项明确加入的实际作用。"]},{"time":185.5,"title":"相邻位置之间的谱势降","narration":["沿着非零整数地址组成的开链，比较相邻两点的对数势，就得到每条边上的谱势降。沿地址增大的方向，势升高，所以负梯度指向地址减小的一侧。","随着地址增大，相邻势差逐渐减小，幅度的领先项是地址的倒数。在任何固定的有限开链上，最小幅度仍然大于零。","这里算出了能量剖面的方向和差值。稳定态是否移动、怎样移动，要继续把这个势接到实际传播中。"]},{"time":223.625,"title":"计算力，还要给出边的长度","narration":["把谱势换算成能量以后，物理力还要除以每条边的实际长度。等地址步若有相同长度，力的幅度就随地址增大而减小。","如果每条边的物理长度本来就正比于对数间隔，那么能量差和长度一起缩小，二者的比值反而是常量。","这两幅图代表两种不同的长度指定。只给同一个空间换一个坐标名字，不能改变实际的力和通量。"]},{"time":256.1666666666667,"title":"左右势差给出离散源项","narration":["在一个内部点，比较右边和左边的谱势降，得到场在这个点的变化。对对数势，结果恰好是一条离散的泊松关系。","这个源项为正，并随地址增大而减小。它由已经给定的谱势和邻接关系算出；此时还没有把它等同于物质的质量密度。","源项的领先项是地址的平方倒数。但它是这条地址链上的场散度。三维径向力还需要实际空间区域、边界面积和通量方程。"]},{"time":293.1666666666667,"title":"内部抵消，边界留下通量","narration":["把连续一段地址的源项相加，中间每条边出现两次，符号相反，于是彼此抵消。最后只剩下区域两端的通量。","把整条开链都算进去，内部的正贡献由端点贡献配平。边界条件还决定整体的场分量，不能在推导中省略。","当内部源项和两端势值一起给定，离散求势问题有唯一解。这里唯一的是这个带边界的求解结果，适用的图结构也已经明确。"]},{"time":329.5,"title":"让谱势进入同一个载体","narration":["现在回到已经形成的稳定态。它具有质量作用，也能沿主单位方向位移。把整数地址上的对数势压缩到这个载体，得到载体实际感受到的矩阵势。","于是，同一个生成元包含质量、位移和势三项。矩阵势通常还会耦合两个取向，不能直接写成运动编号的对数乘单位矩阵。","这里的运动位置沿主单位环连接，整数地址的开链是另一种邻接。采用两臂相干同时作用，并在共享两端同样开启，才得到这里的完整载体生成元。"]},{"time":372.375,"title":"运动由概率流与交换子算出","narration":["从这个生成元出发，可以直接求出相邻位置之间的概率流。一个位置的占据变化，等于流入减去流出，因此总概率守恒。","动量的变化则由势与动量的交换子给出。这是有限空间中的实际响应，不需要预先假设无限空间的位置动量关系。","静态总生成元下，总能量保持不变。势改变了位置平移对称性，具体运动应由含势的生成元计算，不能直接套用无势色散。"]},{"time":409.5833333333333,"title":"热处理怎样保留运动中的态","narration":["热处理时，先把载体连同它的相关性交换到一个等谱副本中。原位置留下已知输入，接受热处理和返回过滤；成功后，再把未知载体交换回来。","成功通道保留完整的运动演化，只附带一个共同的存续概率。失败时，载体和热输出进入真实退出空间，整个过程仍然保迹。","两次交换、热处理、补偿和记录，都计入完整周期。实际频率要用这个总时间计算，开关作用所做的功也必须加入同一本能量账。"]},{"time":451.16666666666663,"title":"平稳分布中，形成和退出仍在继续","narration":["再看直接作用于系统的完整恢复循环。当每轮都有一个正的共同恢复份额，不同初态之间的距离逐轮缩小，最终趋向唯一的平稳态。","平稳的是总体占据。同一个激发可以退出，新的激发可以形成，这些变化在统计上配平，并不要求每一个对象永久存在。","要使平稳态恰好是原壳能量的热平衡态，恢复权重还须与相同温度匹配。对数能量对应另一套平衡权重；热平衡本身也不给出持续的净流。"]},{"time":492.37499999999994,"title":"物质怎样真的改变背景","narration":["只有物质和背景共用尺度，还不足以让物质成为源。在暂停位移的读出窗口，本章让物质的完整响应与指针耦合，把结果写入新的背景资源槽。","在明确的执行概率、脉冲强度和半占用参照下，背景占用的更新可以精确算出：一项移走原来的偏离，一项写入物质的响应。","这个源接口保持静止本征分支及其简并空间，并可能削弱不同本征值之间的相干；新槽补给和退场记录共同进入过程。"]},{"time":532.7083333333333,"title":"共同源比例带有有限脉冲修正","narration":["对一个正的静止本征分支，把每轮源写入率与同一轮的质量频率相比，完整周期在比值中抵消，留下共同系数和一个正弦比值。","采用跨族共同的执行概率、脉冲参数和维持作用量，且各参与分支的脉冲角都足够小时，正弦比值接近一。有限脉冲下，修正随本征值变化，不能省略。","因此，同一个机制既给出了共同耦合的来源，也给出了偏离共同比例的方式。时间在这个比值中抵消，不表示绝对频率的时钟已经不再需要。"]},{"time":576.1249999999999,"title":"源更新之后，还要传播背景","narration":["局部写入以后，再让资源槽沿区域网络交换，就得到背景占用的离散更新方程。当相应线性部分的谱半径小于一，平均占用会趋向唯一的稳定分布。","源的区域网络、整数地址开链和载体运动环，各自承担不同任务。它们怎样对应到同一物理空间，必须通过实际连接说明。","平均占用的传播已经可以计算。下一步还要追踪完整资源历史，计算测试载体在这样的背景中返回时，究竟积累了什么相位。"]},{"time":617.2916666666665,"title":"度量响应的平方怎样平均","narration":["为了刻画背景能标，本章还计算谱势梯度的平方平均。每条边的贡献，等于势差的平方，乘上它两个端点的占据份额。","如果所有地址均匀占据，总的平方权重就除以状态空间维数。这里的维数因子已经来自归一状态，不能再没有依据地除一次。","这个量读取位置占据。均匀纯叠加和完全混合态可以给出相同的平方平均，但它们保留的相干信息并不相同。"]},{"time":654.2499999999999,"title":"归一状态之外，还有参与总量","narration":["把一个状态归一化，会告诉我们各部分占多少，却不会保留总共有多少参与权重。绝对能标需要把这个总量单独留下。","例如，将所有模式的权重同时加倍，归一后的状态和平方平均可以完全不变，参与总量却已经加倍。两种读数描述不同的信息。","只有在全空间每个模式都取单位权重时，参与总量才等于空间维数。选择哪些模式参与，以及各自多少权重，都要在实际背景中说明。"]},{"time":694.2916666666665,"title":"背景匹配给出共同能标","narration":["保留参与总量，采用论文的对数共同响应，再按背景平方匹配，就得到能标：它正比于参与总量的平方根，再乘对数响应。","这个能标的平方倒数，给出画面中的共同强度表达式。参与更多模式如何改变它，现在有了一条明确的条件关系。","但这个关系尚不是自动选定截断深度的规律。它给出背景匹配的能标，实际物质源对测试载体造成多大的作用，还要由返回相位核对。"]},{"time":733.1249999999999,"title":"把完整的作用链接到底","narration":["回看第四章，观测单元提供几何，对数地址提供位置参照；谱势经过长度标定，并进入载体生成元，给出实际运动响应。","物质改变背景资源的源接口已经构造，背景的平方平均和共同能标也有明确表达式。剩下的中心连接，是从源更新和背景传播，走到测试载体的可见返回相位。","连续展开后的返回相位，取负并除以完整周期，给出相对频率；模长决定衰减。用同一个源、同一套资源和完整计时求出动力学强度，再与背景能标比较，才能判断整条链的连接。"]}]},{"id":5,"label":"第五章","title":"态空间与 p 通道","description":"种类标签、CRT结构与具体物质对应","duration":692.520996,"mb":6.8,"video":"https://hushaowu-rh.github.io/videos/paper16-ch5/video.mp4","poster":"https://hushaowu-rh.github.io/videos/paper16-ch5/poster.jpg","page":"https://hushaowu-rh.github.io/videos/paper16-ch5/","source_sha256":"12bfb282f2559ff3fc5e66248ff81d1cfb72d0324a5542147821b9a4381b9dc0","segments":[{"time":0.0,"title":"从态空间到具体的物质通道","narration":["前几章建立了稳定图案、交换和响应的共同机制。要继续计算具体物质，还要选定一个通道，让这些结构有明确的计算对象。","第五章讨论两个相连的问题：什么条件选出素数七？选定以后，方向标签怎样与物质、相互作用对应？","我们沿着结构、选择和物理对应三步走。算术给出的对象，与实际循环给出的响应，会在各自的位置接起来。"]},{"time":35.833333333333336,"title":"种类结构与地址深度","narration":["一个通道固定一个奇素数，同时允许不同的有限深度。素数决定种类层的算术结构，深度决定地址分辨到哪一层。","增大深度，会增加地址和更深的方向，却不改变种类层单位群的阶。改变素数，才会改变这一层的种类结构。","实际循环的交换强度、相位和准备仍然要给定。因此，通道结构提供可使用的空间，具体过程决定怎样使用它。"]},{"time":71.33333333333334,"title":"方向标签与点对分组","narration":["种类层有素数减一阶的循环单位群，也有同样多个 character。去掉平凡方向，剩下素数减二个非平凡标签。","把一个非零地址和它的相反数配成一组，组数则是素数减一的一半。这两个计数都与深度无关，而且彼此满足一个固定关系。","标签形成稳定方向，还需要谱响应非零；点对组对应物理的代，还需要每组成为实际可维持的分支。种类计数也不等于所有深层模式的计数。"]},{"time":109.95833333333334,"title":"共轭、奇偶性与相位阶","narration":["对每个相位标签，都可以问三个问题：它的共轭是谁，在取负下是奇还是偶，重复多少次回到平凡标签。","非平凡自共轭方向恰好有一个，其他方向成共轭对出现。这里的相位阶，描述标签重复的次数，并不直接给出质量大小。","前面采用的对称整组形成，需要商群上忠实而非实的方向，因此要求素数至少为七。这个条件排除了更小通道，还允许更大的通道。"]},{"time":148.875,"title":"互素因子给出张量结构","narration":["再把单位群的阶分解成互素的素数幂。中国剩余定理把种类标签分成几个独立坐标，相应空间具有张量因子结构。","例如，七减一等于二乘三，给出二维和三维因子。五减一等于四，四必须整体保留，不能把两个不互素的二当成独立因子。","每个因子容纳相应的特殊酉变换，再加共同相位，并按规定取中心商。这给出允许的保因子作用，实际力还要通过交换和读出实现。"]},{"time":187.375,"title":"因子数相同，通道仍然不同","narration":["把不同通道放在一起比较，可以看到，仅仅要求有三个结构因子，并不能唯一选出七。十一和十三也有三个因子。","差别在于具体维数：七给出二和三，十一给出二和五，十三给出四和三。它们的点对组数和相位标签数也不同。","所以，选择条件必须指向实际需要的结构关系，不能只凭因子数量相同，就把通道与物理身份一起认定。"]},{"time":222.83333333333334,"title":"单因子与双因子标签","narration":["在二乘三的坐标表里，零零位置对应平凡标签。其余五个位置，就是五个非平凡方向。","只有一个坐标非零的，属于单因子标签，共有三个。两个坐标同时非零的，属于双因子支撑，共有两个。","这个区分很关键。接下来用来选择通道的简单平方规则，约束的是完整的单因子标签集，不是未经区别的所有非平凡方向。"]},{"time":255.75,"title":"平方后的两种简单关系","narration":["对一个非平凡标签，重复相乘一次，要求结果属于两种关系：第一种，平方回到平凡标签；第二种，平方等于自己的共轭。","第一种恰好对应二阶标签。第二种利用共轭等于逆元，改写成三次方为一，所以恰好对应三阶标签。","动画中的圆点追踪标签相乘。这里首先分类相位代数，实际传播的振幅是否非零，还要回到具体端点计算。"]},{"time":291.875,"title":"完整条件怎样选出七","narration":["要求每个因子的全部非平凡标签都属于二阶或三阶。每个循环因子都有一个与因子同阶的标签，因此每个因子只能是二或三。","因子彼此互素，又因为素数为奇数，单位群的阶是偶数，剩下的通道只有三和七。再要求两种关系都出现，就排除三，留下七。","因此，这条选择规则唯一给出七通道；只开放部分标签的通道不在本结论的范围内。"]},{"time":328.0,"title":"标签能相乘，端点未必能返回","narration":["一个具体例子说明标签与过程怎样分工。三阶标签满足平方等于共轭，但在论文给定的零元端点，连续两次同标签出游的返回振幅却为零。","标签乘法告诉我们相位如何组合；实际返回还取决于中间态、顶点和端点是否匹配。代数关系本身不能替代完整路径的矩阵元。","这个区分保留了选择条件的作用，也把后续任务说清楚：选出标签以后，还要计算它的真实传播和读出。"]},{"time":367.7916666666667,"title":"三组位置提供另一项对应检查","narration":["七的非零地址恰好分成三组：一和六，二和五，三和四。若全部整组分别成为实际可维持的代分支，三代对应也选出七。","这与前面的两类标签选择相容，但承担的是另一项物理对应。算术上，标签数和组数本来就有关联，不能把它们当成两个独立数字。","如果一个更大通道只形成三个可见分支，仅凭可见三代就不能单独确定素数。因此，全部整组是否参与，仍要由实际形成过程承接。"]},{"time":409.0416666666667,"title":"五个标签怎样组织候选物质","narration":["在选定的七通道，文中采用这样的种类对应：实方向对应中微子型，两条三阶共轭方向对应带电轻子和相应反轻子。","两条六阶方向分别标记上型与下型夸克。它们同时具有两个因子的支撑。标签间的乘法，也把这两组方向的取向联系起来。","这张表给后续求值规定对象。每一行还需要非零响应和实际循环；色、取向与电荷等信息，要由完整物理表示继续承担。"]},{"time":447.7916666666667,"title":"共轭作用于完整物理态","narration":["上型和下型标签互为共轭，但两类夸克的电荷并不互为反号。因此，只交换这两个种类标签，不能直接解释为完整的粒子反粒子共轭。","一种相容安排，是让共轭同时改变种类和色表示。这样，下型夸克与反上型夸克可以共享一个种类标签，却处在不同的色表示中。","中微子型方向也是如此：实 character 本身还不能证明完整态电中性。还要有完整态自共轭、确定电荷，以及共轭反转电荷，才推出电荷为零。"]},{"time":491.25,"title":"不同物质沿不同端点进入","narration":["前面点对同相的形成端点，直接承接两条非实偶方向。对于奇方向，相反地址的振幅在这个端点相消，结果为零。","所以，夸克和中微子不能直接套用带电轻子的整组公式。它们要经过文中规定的实方向连接、奇偶闭字或间接链端点。","标签表负责确定要研究谁；完整路径负责说明怎样形成非零响应。两者在这里具体交接，也连接到后续各族质量的计算。"]},{"time":528.9166666666666,"title":"两个因子容纳哪些作用","narration":["二乘三的种类空间，对应共同相位、二维因子和三维因子的保因子作用，并取指定的中心商。","二维因子只有一个非零步长标签，却容纳三个无迹自伴生成方向。三维因子有两个非零步长标签，加上对角作用后，容纳八个生成方向。","标签数量和李代数维数数的是不同对象。实现了实际多重态、交换顶点和读出以后，这两个结构因子才落实为相应的弱作用与色作用。"]},{"time":567.375,"title":"种类空间还要接完整物质表示","narration":["这里有一个可以直接检验的表示限制。让三维因子的特殊酉群自然作用在二乘三空间上，会得到两份三维表示，其中没有色单态。","因此，不能同时把这个自然作用认作全部物质的色作用，又把其中某两个向量直接称为色单态轻子。","完整物质表示需要容纳适当的单态、三维载体和共轭载体，再与种类标签相接。这个任务明确了结构表怎样进入物理模型，并没有取消已经得到的标签分类。"]},{"time":607.1666666666666,"title":"电荷由实际生成元给出","narration":["电荷要在实际物理荷扇区上定义生成元。一个分支转移到另一个分支，所带的荷差可以直接由交换子算出；守恒交换则由环境补偿这项差值。","共同中心相位对所有方向给同一个值，因此不能单靠它得到不同粒子的电荷。若仍采用自然色作用，并要求电荷与它对易，至多得到两个电荷值。","所以，完整物质表示和电荷算子必须一起检验。取负奇偶性也不会自动交换标签，单靠实复分类，还没有给出破缺或禁闭机制。"]},{"time":650.9583333333333,"title":"为后续求值确定共同对象","narration":["第五章把前面的一般机制收束到明确对象：在完整单因子标签的选择条件下，采用七通道；三组位置和五个非平凡标签组织后续求值。","完整物质身份由表示承接，非零响应由路径和顶点计算。集体交换与度量响应，继续沿用前两章的过程定义和标定条件。","下一章将从这些参与对象建立共同能标，随后计算耦合与质量。通道、物质和作用因此进入同一条计算链，每一层都保留自己的任务。"]}]},{"id":6,"label":"第六章","title":"能量标度","description":"共同标尺下的电弱、Planck和核子尺度","duration":796.937663,"mb":7.5,"video":"https://hushaowu-rh.github.io/videos/paper16-ch6/video.mp4","poster":"https://hushaowu-rh.github.io/videos/paper16-ch6/poster.jpg","page":"https://hushaowu-rh.github.io/videos/paper16-ch6/","source_sha256":"12bfb282f2559ff3fc5e66248ff81d1cfb72d0324a5542147821b9a4381b9dc0","segments":[{"time":0.0,"title":"三个尺度，同一个背景","narration":["电弱、度量和核子过程的尺度相差巨大，能不能用同一个背景来比较？第六章把这个问题归结为：究竟有哪些分量参与，以及参与多少。","电弱过程使用单位壳的剩余权重，度量过程使用带权全空间，核子过程使用集体谱准备。三条路线最后代入同一个能标函数。","我们会逐步追踪这些参与量，再看数值结果、修正和适用范围。各类尺度共用一个能量标定，具体参与方式分别由相应过程承接。"]},{"time":41.166666666666664,"title":"平方响应如何匹配共同能标","narration":["共同背景的常数，来自相邻正整数对数间隔的平方和，并把两个方向都计入。它约等于一点九五四三八。","在既定的相干响应和平方匹配条件下，能标等于参与量平方根乘以它的对数，再乘共同系数。参与量越大，这个函数越大。","公式中的能量标定把无量纲响应接到物理时间和能量。采用一吉电子伏特作为它的数值，是物理标定条件，不能仅由选择计量单位得到。"]},{"time":79.125,"title":"电弱过程分辨到哪一层","narration":["先看电弱过程。过程使用的分辨深度，与完整态空间的深度可以不同。主单位部分在过程深度内，共有深度减一层。","本节采用一项明确对应：实际色载体的三个分量，分别由三层标号承载，全部对应并且不另留额外层。于是过程深度取四。","这些有限域分层本身还不是复色载体。三分量的实际表示仍按上一章落实；完整态空间也仍然允许比四更深。"]},{"time":116.58333333333334,"title":"2058 数的是参与模式","narration":["在更深的空间里，把模七的四次方相同的地址收为一组。每组只选一个同幅同相的归一组合，不同组之间相互正交。","这样得到的参与投影，秩等于六乘七的三次方，也就是二千零五十八。再给每个模式一份单位权重，就得到裸参与量。","这个数字数的是所选分辨范围的正交模式。纤维内部其他相位排列没有计入，因此它不是完整深层态空间的总维数。"]},{"time":152.5,"title":"从十八类匹配到有效分母","narration":["独立标签准备给出三乘三乘二，共十八类裸匹配备选。这里的重复备选必须由独立的准备或记录状态承担，不能只换一个名字就增加维数。","再按文中指定的负三、正一和正二路由系数，加入三类谱响应，得到约十八点二四六一七八的有效分母。","这些响应在二分之一的解析谱参照处求值；它们不等于该点的无限正整数热概率。实际准备和修正余项，仍由完整循环检验。"]},{"time":190.75,"title":"有效分母怎样成为剩余参与量","narration":["要从匹配分母走到背景参与，还要把它对应为实际占用的绝对权重。用一个正占用算子描述这件事，从参与投影中扣除，得到剩余权重。","采用这项对应，剩余参与量约为二千零三十九点七五四。非整数来自各模式可以部分占用，并不是删除了非整数个正交向量。","占用超过十八，所以不能只把它塞进十八个单位容量的格子。画面保留总量和扣除量，相应占用怎样实现，仍由实际准备与交换说明。"]},{"time":232.54166666666666,"title":"电弱尺度的三步变化","narration":["将三种参与量代入同一公式：不扣占用时约二百四十七点五七九；扣除十八时约二百四十六点二一零；再加入有限修正，得到二百四十六点一九一。","采用共同能量标定一吉电子伏特，最后一个数就以吉电子伏特读出。与文中采用的费米尺度相比，低约百分之零点零一一四九。","这项有限修正使结果进一步远离所选中心值；理论误差仍待独立量化。"]},{"time":269.0833333333333,"title":"能标必须经过完整时钟读出","narration":["谱响应要成为实际频率，需要放进同一个完整过程。平均驱动必须用总时间计算，活动段、暂停、修复和热处理都算进去。","真空平方匹配把这个平均驱动标定到共同背景，才得到能标与实际频率的对应。它不要求每轮速率直接等于电弱能标。","就绪概率控制形成收敛，存续概率控制包络，不再乘一次质量。但若驱动不变而处理时间增加，单位物理时间内的实际频率仍会下降。"]},{"time":308.75,"title":"度量过程采用带权全空间","narration":["度量过程改用整个态空间，各赋值壳和零元一起计入。若每个正交模式都取一份单位权重，裸参与量就是素数的深度次方。","同一个能标函数因此给出远大于电弱参与范围的候选尺度。这里零元也承担参与权重，虽然它不属于前章的非零对数开链。","梯度背景在哪里定义，与哪些模式参与响应，是两个分别指定的范围。不能直接把开链的边数当成完整态空间的模式数。"]},{"time":346.6666666666667,"title":"四十一来自什么容量条件","narration":["七通道的仿射群有四十二个元素。群代数的系数求和映射，核的维数少一，得到四十一维的增广理想。","这个有限域向量空间有七的四十一次方个配置。如果要求每个配置都有可完全区分的正交记录，并选择能容纳它们的最小寄存器，才得到深度四十一。","后续度量求值采用这一最小记录容量对应的深度，K 等于四十一。"]},{"time":379.58333333333337,"title":"七层结构怎样承接节点权重","narration":["另一项修正来自平凡模射影覆盖的七层结构：首尾是平凡标签，中间五层分别出现五个非平凡标签。它与四十一维增广理想不是同一个对象。","按指定的节点处方，两个层各取一除以根号二，一个层取三除以谱参照的绝对值，其他层取一。沿五层相乘，得到约一点零二七一四八。","层结构确定哪些标签出现几次；节点数值怎样作为参与权重使用，还要明确输入、输出和归一。振幅与概率不能因为写在同一图里就直接混乘。"]},{"time":424.20833333333337,"title":"权重修正不改变状态维数","narration":["将层乘积用于度量参与，得到全空间模式数乘以这一权重。一个对应的正算子，是把恒等算子整体乘上层因子。","层因子大于一，没有增加空间维数，也不表示事件概率超过一。归一化以后，状态仍然是均匀态，改变的是绝对参与总量。","代入共同能标时，这个因子必须同时进入平方根和对数。只在公式外面补一个系数，会遗漏对数响应随参与量一起变化的部分。"]},{"time":462.25000000000006,"title":"度量能标的数值与对照","narration":["采用四十一层和共同能量标定，裸度量尺度约为一点二零四八乘十的十九次方吉电子伏特；加层修正后，约为一点二二一四五乘同样的数量级。","与文中采用的非约化普朗克尺度比较，修正改善了中心值，剩余能标偏差约正百分之零点零四五五六。它仍大于相应实验不确定度。","能标的平方倒数给出候选系数。但普朗克尺度与引力常数来自同一个实验约束，不能当两项独立命中；实际场强还须接上源和返回相位。"]},{"time":505.37500000000006,"title":"巨大层级主要来自参与范围","narration":["将度量尺度除以电弱尺度，共同的能量标定和背景常数消去，得到约四点九六乘十的十六次方的层级。","这个巨大差别主要来自参与范围：一边是四层单位地址上的剩余权重，另一边是四十一层的全空间。节点修正只在其上作有限调整。","增加一个完整深度，能标约乘二点七一；本次节点修正则增加约百分之一点三八二三。这说明深度选择的作用远大于这里的有限层修正。"]},{"time":544.25,"title":"核子路线先确定最低色单态","narration":["核子路线先从内部色表示开始。只采用同一种基本色表示时，色单态存在的条件，是表示维数整除张量因子数。","必要性来自中心相位，充分性由完全反对称张量给出。在三维基本表示中，最低非空单态使用三个因子，色部分只有一个独立方向。","这项最低性限于纯基本表示。如果加入共轭表示，二者的张量积已经可以有单态。这里数的是色表示因子，也不能只凭张量记号就认定是几个独立粒子的束缚态。"]},{"time":586.9166666666666,"title":"集体参与来自正整数谱准备","narration":["色单态决定内部表示以后，还需要确定集体谱准备。采用正整数对数能谱，各项正权重随整数的负幂衰减，它们的总和是配分和。","全空间常图案在每个乘法拉回下保持不变，因此这个未归一响应在它上面，恰好给出总权重。采用参与对应以后，才把它作为核子的参与量。","完整谱在参数大于一时收敛到泽塔函数。谱截止与地址深度分别指定，这里的准备参数也不能直接当成原壳生成元的同一个温度。"]},{"time":628.625,"title":"谱参数由哪条规则选定","narration":["正整数对数谱的能量方差，可以由配分函数的对数二阶导数求出。在参数从大于一的一侧靠近一时，领头项是偏离一的平方倒数。","本节把这个领头项与基本色表示因子数对应。最低三色单态使用三个因子，于是参数取一加上根号三的倒数。","这是一条额外的谱准备规则，不是从色单态条件单独推出的温度。由于选出的参数并不任意接近极点，还必须检查精确方差与领头项之间的差异。"]},{"time":668.4166666666666,"title":"核子尺度回到同一个能标式","narration":["代入选定的谱参数，总权重约为二点三四九六三六。继续使用同一个背景常数和能量标定，得到约九百三十六点六六九兆电子伏特的候选核子尺度。","与文中采用的质子质量比较，低约一点六零三兆电子伏特，相对差约负百分之零点一七零八二。质子质量在这里作为外部对照。","这给出集体参与的整体尺度。后续集体载体的完整返回和同源标定，负责把它接成实际静止质量；具体核子种类间的分裂还需要内部结构。"]},{"time":711.25,"title":"准备规则和截止会改变结果","narration":["精确计算同一个参数处的方差，得到约二点八六零二，比三低百分之四点六五九五。这项差异不能直接当作质量误差条。","如果改用精确方差等于三来选参数，会得到另一种谱准备，质量约九百六十二点七八四兆电子伏特，不能与原来结果混称同一处方。","再比如，参数与背景保持不变，只把谱截止设为二千四百，能标约九百二十三点七六七兆电子伏特。截止、准备和背景必须分别入账，并没有把电弱深度强加给核子。"]},{"time":755.3333333333334,"title":"三条参与链汇入共同标尺","narration":["回看第六章，电弱尺度来自剩余单位壳权重，度量尺度来自带权全空间，核子尺度来自集体谱准备。三条路线共用同一个能标函数。","差异在于实际参与什么、如何准备和赋权，以及完整时钟怎样读出响应。没有给每一类过程再补一套独立的能量单位。","这些条件使计算对象和比较方式明确起来。下一步，力的耦合和各族质量将沿这些共同标尺继续求值，同时保持源、背景和实际返回的对应。"]}]},{"id":7,"label":"第七章","title":"力耦合常数","description":"谱顶点、Born响应与五类耦合","duration":905.020996,"mb":8.0,"video":"https://hushaowu-rh.github.io/videos/paper16-ch7/video.mp4","poster":"https://hushaowu-rh.github.io/videos/paper16-ch7/poster.jpg","page":"https://hushaowu-rh.github.io/videos/paper16-ch7/","source_sha256":"12bfb282f2559ff3fc5e66248ff81d1cfb72d0324a5542147821b9a4381b9dc0","segments":[{"time":0.0,"title":"五种耦合，三条计算路线","narration":["同一态空间里的不同作用，为什么会有不同的耦合强度？第七章从稳定态的谱响应出发，把响应怎样进入实际交换逐步展开。","三种基本共振力，取一个匹配方向的份额；核交换，把多个正交输出的响应相加；度量力，则沿上一章的共同能标取逆平方。","下面分别计算三条路线的响应，并按各自的物理定义、尺度和单位与实验比较。"]},{"time":34.333333333333336,"title":"概率权重怎样进入振幅","narration":["先准备一份有限的对数能谱。第几个模式的能量是它编号的对数，热概率因此正比于编号的负贝塔次方。","把准备写成系统和辅助的标准纯态，概率权重就对应振幅模长的平方。给定负贝塔次方的概率，振幅模长便带负二分之贝塔次方。","这个平方根关系说明了振幅和概率的联系，但不能单靠概率决定各条路径的相对相位。有限准备的归一和真实顶点的选择，也各有自己的作用。"]},{"time":72.58333333333334,"title":"半点谱值使用解析参照","narration":["本章采用临界参数贝塔等于一所对应的平方根指数，也就是谱点二分之一。有限截止下仍能准备，无限正整数谱的配分和在贝塔等于一时则发散。","在这个谱点，用方向的狄利克雷函数除以共同的泽塔参照，得到共振比；再取模平方，得到平方响应。后续统一使用这组数。","这里的泽塔半点值是负数，它来自解析谱参照，不是正热权重求和。这项取值约定需要保留，不能用平方根关系把它省略。"]},{"time":113.83333333333334,"title":"六个方向只需三组非平凡权重","narration":["固定模七的生成元三，六个方向的谱值可以由有限的赫尔维茨泽塔和计算。第一和第五方向共轭，第二和第四方向共轭，第三方向的谱值为实数。","因此非平凡方向只留下三组平方响应，约为零点三四四七六、零点零四七五六和零点六一六四五。共轭改变相位的符号，不改变这些模平方。","平凡方向还要单独处理：它的共振比约为零点六二二，不能与平方响应混用。单位壳平均态、全空间常图案和终端零元，也不是同一个对象。"]},{"time":158.83333333333334,"title":"直接截断归一会得到不同结果","narration":["可以做一个直接检验：如果把分母换成有限正权重之和，再让截止变大，会发生什么？","非平凡方向的分子收敛，而正分母持续增长，所以这个比值趋向零。主方向只筛去七的倍数，归一后的极限则是七分之六。","它们都不是上一幅图里的解析谱比。因此这里不能把两种准备混在一起；后续耦合的数值使用指定谱点和共同解析参照。"]},{"time":193.16666666666669,"title":"把谱比接成完整成功块","narration":["谱比还需要进入一个完整作用。文中用六个有限群作用合成谱算子，并扣去平凡方向，使非平凡方向保留所需响应，而单位壳平均态被消去。","六个实系数的绝对值之和小于一。再加入一正一负两条恒等路径，就能以归一的八标签辅助准备，构成完整的受控酉作用。","末端相干回投给出谱成功块，其余正交输出负责补齐失败效应。相消路径也不能删除。这证明给定谱比可实现，实际采用这份准备仍是过程条件。"]},{"time":236.95833333333334,"title":"单址读出给出六分之一","narration":["现在沿同一个谱仪器读取一个模七地址，并保留它的全部深层提升。非平凡方向在六个单位地址上等幅，所以单址投影自然给出六分之一。","谱成功和单址输出一次算完，结果就是该方向平方响应除以六。第二方向的结果，恰好等于后面电磁的裸耦合。","这种相等发生在标量读数上。独立六标签匹配可以给出同一个数，但完整辅助和环境记录并不因此相同；也不能再除去一次成功概率。"]},{"time":277.375,"title":"传递通道和顶点方向分开","narration":["一种力的通道标签，与顶点采用哪个稳定态的谱响应，需要分开看。端点从一个方向转到另一个方向，环境承接的是两者的种类差。","顶点的谱因子则来自参与稳定态本身。在本章的对应里，色、电磁和弱顶点分别选第一、第二和第三类代表响应。","因此，不能只看到传递了哪一个特征标，就把它的谱值直接当成顶点强度。实际色表示、弱表示、电荷和读出，仍须按既定载体落实。"]},{"time":317.5833333333333,"title":"三个匹配分母怎样数出来","narration":["在六元单位群里，方向的阶决定核有多少个元素。阶分别为六、三和二，核的阶就分别是一、二和三。","每一类再乘三个点对组。弱方向还采用两个独立取向备选，得到三类裸分母：三、六和十八。这里的点对组数不随深层地址数增长。","取向的加倍要有不同的准备或环境标签承载。如果只是同一个完整状态的两种写法，就不能重复计数；若路径通向同一末态，则要先加振幅。"]},{"time":357.75,"title":"等权准备只匹配一个方向","narration":["把这些标签准备成等权混合，再让顶点只匹配一个归一方向。这个方向在准备中的份额，就是总标签数的倒数。","谱平方响应乘匹配份额，得到裸耦合。色、电磁和弱耦合的倒数，依次约为八点七零二、一百二十六点一五一和二十九点二零零。","如果换成不等权准备，匹配份额，也就是标签数的倒数，就要换成实际匹配期望值。后面虚过程的内部输入仍使用这里的裸值，不把修正结果重新塞回去。"]},{"time":399.5,"title":"有效分母描述匹配份额","narration":["虚过程修正先从准备入手。把未归一的正准备记下来，用总权重除以匹配方向上的权重，就得到有效分母。","分母变小，说明匹配方向相对更集中；分母变大，说明它的份额被稀释。这两个变化都可以发生在原来的整数维标签空间里。","因此，小数分母表示的是一个权重比，不是又增加了零点几个状态。真正需要解释的是实际返回过程怎样产生这份正准备。"]},{"time":437.125,"title":"三条有限修正沿不同荷路由","narration":["两次同荷作用如果复合非零，复合荷就由特征标的平方确定。第一和第二代表仍落在非平凡方向，第三代表则回到平凡荷。文中据此区分两类路由。","在所取有限修正规则下，色和电磁分母加一份背景贡献、减两份自身响应；弱分母减少三份色响应，再增加一份电磁和两份弱响应。","代入后，分母分别约为二点九二七、六点五二一和十八点二四六。特征标乘法约束允许去向，各项系数以及真实背景方差仍需对应实际过程。"]},{"time":482.9583333333333,"title":"电磁偏移怎样重复返回","narration":["电磁代表的平方落在它的共轭方向，因而可以考察共轭对之间的重复作用。在选中的反对称取向模上，每轮修正带负的重复比。","用文中的裸输入组合，重复比约为零点零零六九七二。再指定每次分母偏移等于前次的负重复比倍，就得到收敛的交替几何级数。","求和只修饰偏移，原来的六保持不变，最终分母约为六点五一七七一五。这里的交替号属于振幅与分母递推，不能直接当成负的事件概率。"]},{"time":523.75,"title":"修正后仍能由正准备实现","narration":["这些修正会不会破坏概率的正性？可以在原标签空间里直接检查：给匹配方向分配完整分母的倒数，剩余权重平均分给其余方向。","三个完整分母都大于一，所以每一个本征权重都非负，全部相加正好是一。相同谱顶点在这份准备上，给出所需修正耦合。","这一步证明数值与合法准备相容。它没有自动确定真实循环如何形成这份准备；实际事件还要补齐仪器的其余输出，并检查总效应不超过一。"]},{"time":565.7083333333334,"title":"三种基本耦合汇到同一求值","narration":["现在把谱响应与完整分母合起来。色耦合约为零点一一七七八九，电磁倒数约为一百三十七点零三六三五九，弱耦合倒数约为二十九点五九八八九四。","电磁这一行最能看清层次：裸倒数是一百二十六点一五一，有限修正后是一百三十七点一一二，再求和成为一百三十七点零三六。","这些数字使用同一谱参照，但分母各自承接不同路由。保留很多小数便于复算，不代表这些条件机制已经具有同等的物理预测精度。"]},{"time":608.625,"title":"电磁数值接近，差异仍可分辨","narration":["把电磁响应对应到低能精细结构常数，文中采用的实验倒数约为一百三十七点零三五九九九。框架求值比它高约零点零零零三六。","相对差约为百万分之二点六三。相对于这个数值本身，它很小；但相对于所引实验的不确定度，它仍然明显可分辨。","所以正确的对照是同时保留接近程度和剩余差异。谱点到实际顶点的对应、有限修正和高阶递推，还需要各自的理论误差评估。"]},{"time":648.0,"title":"强弱比较必须固定定义与尺度","narration":["色响应若与文中选定的强耦合比较，对照是Z玻色子的质量尺度、指定重整化方案下的零点一一八零，中心值相差约负百分之零点一七九。","弱耦合需要更小心。规范耦合可以写成同一尺度下的电磁耦合除以混合角的正弦平方，但这里两个输入必须采用相容的尺度和方案。","不能把低能电磁常数与另一种定义的混合角直接拼起来宣称精确吻合。这些外部读数只用于检验，没有放进前面的谱权重和分母计算。"]},{"time":690.5833333333334,"title":"集体交换为什么可以增强","narration":["核交换采用另一种合计方式：同一个匹配输入，可以把响应送到多个彼此正交的完整输出。各输出可区分，所以响应按通道相加。","模七仿射群共有四十二个操作。只有实际交换实现这些输出，并给每条路径明确的系数，这个操作数才进入集体响应。","即使末端不显示标签，只要完整环境中的输出仍正交，也要相加响应。若路径最终没有任何区别，就必须按输出重叠计算，不能继续按四十二条独立路求和。"]},{"time":733.25,"title":"同一层权重用于核交换","narration":["上一章给出的层权重约为一点零二七。本节规定每条仿射输出带它的倒数，总响应权重因此是四十二除以层权重，约四十点八九。","再把第一或第五方向的谱因子作为混合顶点部分，就得到候选核耦合十四点零九七。度量过程用层权重相乘，核交换则用它相除，两个方向分别由过程指定。","按文中采用的π介子与核子的顶点对照，中心值是十三点七，当前结果高约百分之二点九。若换成纯涌现响应或改变末端匹配，表达式也要随之改变。"]},{"time":780.2916666666666,"title":"响应、事件份额和记录率分开","narration":["核耦合大于一，并没有违反概率限制，因为这里得到的是匹配输入下的响应比。实际事件还要乘仪器强度的平方。","把所有所选通道的效应相加，要求它不超过恒等作用，再补齐其余输出，才得到一次循环的合法事件份额。仪器强度越小，事件份额也越小。","若输入已经平稳，而且每轮只计一次所选末端结果，再除以完整循环时间，才得到记录率。实际占据、仪器标定和完整历时都不能省略。"]},{"time":821.5,"title":"度量力常数承接整体能标","narration":["最后回到度量路线。上一章的整体能标取逆平方，得到带能量负二次单位的候选常数。深度四十一、标定一吉电子伏特时，结果约为六点七零三乘十的负三十九次方。","与文中牛顿常数对照，中心值差约负百分之零点零九一，仍超过所引测量不确定度。它与普朗克能标的比较按定义等价，不能算成两次独立检验。","要识别为空间引力，仍须接上源、响应与归一化。深度加一会改变这个常数，能量标定也以逆平方进入；这些条件没有进入前四类耦合的本章求值式。"]},{"time":870.2083333333334,"title":"共同来源，分别落实物理读数","narration":["回看第七章，色、电磁和弱三类耦合共享谱响应，用匹配份额区分强度；核交换把正交输出合计；度量力常数沿整体能标读出。","单匹配份额、正交输出合计和能标逆平方，分别给出三条路线的耦合读数。","这就为下一章准备好了输入：质量过程需要哪一类顶点、采用裸响应还是修正响应，要由各族的实际形成与维持决定。"]}]},{"id":8,"label":"第八章","title":"基本态质量谱","description":"轻子、两类夸克和中微子的质量","duration":1113.187663,"mb":10.2,"video":"https://hushaowu-rh.github.io/videos/paper16-ch8/video.mp4","poster":"https://hushaowu-rh.github.io/videos/paper16-ch8/poster.jpg","page":"https://hushaowu-rh.github.io/videos/paper16-ch8/","source_sha256":"12bfb282f2559ff3fc5e66248ff81d1cfb72d0324a5542147821b9a4381b9dc0","segments":[{"time":0.0,"title":"同一个背景，为什么质量不同","narration":["同一背景中的基本态，为什么既有族内的质量层级，又有族间的巨大差别？第八章把问题放回同一个过程：形成图案，沿路径交换，然后持续返回。","共同背景提供能量标定，路径和节点决定实际交换的系数，图案在端点上的投影以及返回方式，再区分各条质量分支。","我们沿这条链，依次看带电轻子、下型夸克、上型夸克和中微子。最后检验哪些关系消去了共同尺度，哪些结果仍需与实际质量定义匹配。"]},{"time":43.125,"title":"相位必须连同背景一起确定","narration":["先看共同的偶方向。第二方向的复谱值有一个小的负相位，约负十三点一八四度。本章形成图案采用它相对于实背景的相位。","如果改用共振比，分母是负的泽塔半点值，辐角就会相差半个圆周。虽然谱比的模平方不受这个符号影响，相对背景的形成角却会改变。","文中用明确的一次相位操作，把谱仪器接到所需的背景约定。由此确定形成角的起点，不把不同参照下的辐角直接混用。"]},{"time":83.08333333333334,"title":"有限和给出相位同余类","narration":["这个谱相位还可以用有限和来核对。按同一个特征标取向，雅可比和等于一减三倍根号三乘虚数单位，再除以二，模长是根号七。","它和高斯和、中心函数方程相连，给出六倍形成角的指数关系。但这个关系首先确定的是相位同余类，不是自动选出一个角。","再用实际复谱值落在负三十度与零度之间的区间，选定所需分支，得到负零点二三零一一二弧度。分支选择必须和公式一起保留。"]},{"time":123.91666666666669,"title":"等幅源怎样留下三组图案","narration":["形成源包含两部分：单位壳背景，以及第二、第四共轭方向的归一组合。两个方向带相反相位，和背景一起构成一个相干图案。","背景与共轭组合等幅，是指定交换与正支满反馈的结果。它们彼此正交，所以最后再除以根号二，使整个形成态归一。","反馈结果与交付源分开保留，相位操作随后只执行一次。图案内部的相干决定各组读数，不能把它先换成方向的概率混合。"]},{"time":163.33333333333334,"title":"形成修饰改变同一图案的角","narration":["上一章的完整谱仪器，在一个地址上的实际输出给出裸电磁响应。用两份独立谱辅助和相干中继，形成修饰得到一阶响应减去二阶组合。","在所选单位作用量下，这个修饰角约为零点零零七八九一弧度。它加到裸谱相位上，形成角变成约负十二点七三二度。","单位容量已经由谱仪器实现；实际形成对应一个单位作用量，是另一条物理连接。这里使用裸电磁输入，后面的返回增强再采用修正级耦合。"]},{"time":205.20833333333334,"title":"三组读数来自同一相干叠加","narration":["把图案投到三个整组端点，振幅都由背景的一，加上同一个余弦项组成，只是三个端点的相位间隔各为三分之一圈。","形成修饰后，三项振幅约为二点三七九、零点五八零和零点零四零。取平方再除以六，得到相加为一的三组份额。","最小的那一组，来自背景与共轭分量接近相消。这解释了它为什么很小，也解释了为什么很小的形成角变化，都可能明显改变这一组的相对强度。"]},{"time":244.75,"title":"同源背景给出参照组分母","narration":["三组概率只是形成源的份额，还要通过实际匹配进入持续作用。物质端读取本组，背景标定则读取同一个源的第零组。","共同标定相除后，留下本组份额与第零组份额的比值。三项相对因子便是一、零点零五九四六，以及零点零零零二八七六。","同源背景响应提供参照份额，使本组与参照组的比值进入质量；其他分段、反馈或中继按各自过程计算代间因子。"]},{"time":282.375,"title":"形成偏角与持续频移分开计入","narration":["形成角先改变交付图案，持续作用再使每轮相位按同一比例缩减。这两件事在同一相位参照下计算，但作用的位置不同。","用每轮相位减去修饰量，再除以实际完整周期，得到质量读数。在文中的独立修饰槽条件下，修饰量与原相位成比例，于是留下共同频移因子一减修饰角。","修复和热处理的耗时也在完整周期里，就绪和存续概率分别影响形成收敛与包络。只把周期延长所得到的倒数因子，不能替换这里的相位插入。"]},{"time":326.8333333333333,"title":"轻子路径先闭合，再读强度","narration":["带电轻子先沿第二方向出游并返回，再沿第四共轭方向出游并返回。两次完整谱响应先相乘，给出谱模平方，再对这个完整分量读取闭合强度。","因此路径留下四次谱幂。入口的二元同相态再连接一个指定分量，给出一次根号二的倒数；中间零元只做连接，不另插入谱响应。","这个入口振幅，与形成图案本身的归一是不同位置。它们不能重复计数。路径和节点合起来，就是三条轻子分支共享的族系数。"]},{"time":368.91666666666663,"title":"三代轻子共用一个尺度","narration":["把共同背景能标、轻子路径、节点和频移相乘，第零组给出陶轻子的基准质量，约一千七百七十六点九二七兆电子伏特。","另两组分别乘相对强度，得到缪轻子约一百零五点六五五兆电子伏特，以及电子约零点五一一零一二兆电子伏特。","这三条分支的层级来自同一相干图案。电子对应接近相消的端点，因此对形成相位和背景相对振幅尤其敏感；与实验误差的比较留到本章末尾。"]},{"time":408.87499999999994,"title":"下型分支区分线性与分段读出","narration":["下型路线从偶方向接入实方向，最终指向第五代表方向。特征标乘法确定标签关系，真实吸收、形成和环境配平仍要沿实际路径完成。","底夸克分支的末端实响应保持在线性层面，所以留一份实谱值。奇异和下夸克采用已经记录的分段强度，因此留下它的平方。","两种读出共有前面的偶共轭闭合，却并不使用同一个末端响应。第五方向是奇方向，最后也不能继续用会相消的对称端点。"]},{"time":450.20833333333326,"title":"节点因子跟着实际端点走","narration":["底夸克节点有三个部分：二元入口的单分量重叠，三个末端色分量的等权线性合计，以及一份全谱背景参照。它们共同给出三除以根号二和背景模长。","奇异与下夸克则沿两段条件响应，各留一份背景模长的倒数，不再采用同一种末端色合计。因此节点总因子变成背景模平方的倒数。","颜色数本身不决定逐色耦合，出现记录也不会自动删除入口投影。这些因子跟随实际顶点和读出成立，经过壳平均态也不意味着可以更换背景参照。"]},{"time":495.58333333333326,"title":"翻转链接使用未修饰谱相位","narration":["下夸克比奇异夸克多一个翻转链接。连续两次重叠分别给出裸谱相位的余弦和正弦，因而裸翻转振幅约为零点二二二零七四。","两条标签通路和三种颜色的记录，在所选权重下一阶修饰这个振幅。文中把振幅截断式作为有限处方，得到零点二二四七一五，平方约零点零五零四九七。","若把概率的一阶截断直接当作完整概率，再开平方，会得到略不同的振幅。两个有限处方在二阶不同，也不能只凭这条链接就认定已经推出弱混合矩阵元。"]},{"time":541.2916666666666,"title":"下型质量同时检验路径和链接","narration":["将两种路径和节点分别接到共同背景，底夸克取基准组，奇异夸克取第一相对组，下夸克再乘翻转强度。","得到的三个数依次约为四千一百八十五点四二、九十二点一一和四点六五一兆电子伏特。底与奇异的差别，同时包含实方向读出、节点和组匹配。","下与奇异的质量比则单独留下翻转强度。比较这些结果时，夸克质量的重整化方案和尺度必须保持明确，不能只比较名字相同的数字。"]},{"time":581.7916666666666,"title":"上型三支共享一条闭合尺度","narration":["上型路线加入奇方向的共轭闭合。偶方向和奇方向各留下四次谱幂，实方向读取强度，留下平方；入口仍只计一次二元单分量重叠。","这些作用组成上型三支共享的路径系数。魅夸克采用基准读出，乘共同标定与频移，得到约一千二百六十二点八四三兆电子伏特。","标签乘积回到平凡方向，只说明通路在标签上闭合。真正的谱幂次还来自访问与读出，不能仅凭闭合二字把系数直接写出来。"]},{"time":623.375,"title":"顶支把返回核接入循环相位","narration":["顶夸克分支累积同一个闭合通道的线性返回。指定每次响应乘一减修正级电磁耦合，且各次贡献同号，几何求和便给出电磁耦合的倒数。","把这个响应作为同一周期内的相位增强，再按完整历时读出，得到约一百七十三点零五五吉电子伏特。这里使用的是上一章修正级的电磁值。","有限次返回仍有余尾，也必须计算实现它的全部耗时。若把这个倒数解释成平均等待轮数，等待时间也要计入，就不是这里的同一个质量过程。"]},{"time":666.6666666666666,"title":"上夸克采用翻转后的单次交付","narration":["上夸克采用另一条分支：先取翻转强度，再接一次弱通道交付。把两项相容的响应相乘，作为相对于魅夸克的代间因子。","于是上夸克质量约为二点一五四兆电子伏特。上型三支共用同一个谱尺度，魅取基准，顶取返回增强，上取额外交付抑制。","交付响应与实际条件概率、准备份额和循环相位之间，由完整仪器承接。改变这些过程条件，就需要重新求值，而不是只保留最终乘积。"]},{"time":708.4166666666666,"title":"对称入口为何不直接激发奇方向","narration":["中微子路线从另一个入口问题开始。自共轭的第三方向在取负配对的两点上振幅相反，而所选直接种子在两点上同相。","对称入口与这个奇方向的振幅重叠恰好相消。因此文中让这份准备进入间接中继，而不是沿同一个对称入口直接形成。","这里为零的只是指定的对称振幅，格点占据和反对称端点仍可能非零。不能仅凭特征标为实数，就排除其他准备对这个方向的直接激发。"]},{"time":747.5416666666666,"title":"中微子的小尺度来自完整间接链","narration":["间接路线含两份偶共轭闭合，所以谱因子变成八次幂。两次二元入口的振幅重叠相乘，再给出二分之一。","背景采用四层参与空间，每次均匀准备后只匹配一个指定模式。第一次和第二次条件匹配各给一除以二千零五十八，两者合成平方抑制。","第二次份额需要真实重新准备，连续施加同一个投影不会重复产生这个分母。这里用裸模式数，不用扣除占用后的背景余量；匹配响应进入相位还须保留路径对应。"]},{"time":790.0416666666666,"title":"三条点对链组成正质量核","narration":["中微子的三条点对链具有不同权重。每条链取两侧剩余类谱和的乘积，并使用指定谱指数三；这些级数绝对收敛，权重都为正。","将偶共轭图案的三个分量循环排列，组成三列输出向量。每一列作外积，再乘对应链权重并相加，就得到一个正的质量核。","这里保留列向量和链权重的绝对大小，不再把核除以它的迹。谱指数与循环接线是这条路线的数据，实际维持中的永久记录还要按完整载体处理。"]},{"time":831.0833333333333,"title":"为何中微子谱不随形成相位平移","narration":["循环矩阵每一列的平方范数都是六，不同列的内积都是二分之三。因此它的格拉姆矩阵不含形成相位。","把链权重的平方根放在两边，就得到另一个具有相同本征值的正矩阵。它同样没有形成相位，所以这份固定连接下的三个谱值不随相位平移。","不过，原矩阵和本征向量仍可能改变。谱不变不能同时推出混合角，更不能据此推断维持中必然没有频移；后者仍由中性路线单独指定。"]},{"time":870.3333333333333,"title":"中性路线读取三个本征频率","narration":["从间接核读取绝对质量，还要把它装到真实持续载体，并和背景共享源、准备和完整时程。文中另采用二分之一的中性节点归一。","整体的四分之一由两个二分之一相乘：一个来自两次入口重叠，另一个来自节点归一。所选中性路线不插入带电频移，得到约五点零七一、九点九六一和五十点六三二毫电子伏特。","总和约六十五点六六四毫电子伏特。实特征标或马约拉纳表达式中的二分之一，并不能单独决定节点系数；加载成功率也不再额外乘到已交付载体的频率上。"]},{"time":918.4999999999999,"title":"数值接近与实验误差分别检查","narration":["九个带电分支与文中选定的实验中心值在比例上接近。其中电子偏高约百分之零点零零二六，缪轻子偏低约百分之零点零零二八，仍超过它们的测量不确定度。","夸克各行使用不同的规定尺度和质量定义：轻夸克取两吉电子伏特，魅和底取自身尺度的运行质量，顶采用直接重建参数。","因此这些百分比先表示对选定数值基准的差。把模型质量算子接到相应定义之后，才能据此判断严格的拟合表现，不能把所有小残差统一称作实验精度内吻合。"]},{"time":964.2916666666665,"title":"消去公共因子，检验谱形和节点","narration":["在当前三项振幅都为正的分支上，轻子平方根质量正比于形成振幅。利用振幅和为三、平方和为六，质量总和除以平方根总和的平方，就严格得到三分之二。","这项谱形关系消去了公共能标和频移，但保留等幅准备与符号分支的条件。若有振幅为负，平方根质量要取绝对值，原来的求和不能照搬。","跨族比值也能消去共同因子。底与陶的比值检验实响应和颜色节点；顶与上乘积除以魅质量平方，则检验翻转和交付的一致性。实际数据比较仍需保持质量定义相容。"]},{"time":1013.0416666666665,"title":"中微子要比较质量平方差","narration":["振荡实验直接约束的是质量平方差，不是三个绝对质量。按正常排序，本章给出两个平方差，约为七点三五一乘十的负五次方，以及二点五三八乘十的负三次方，单位都是电子伏特平方。","两者的比约为三十四点五二三，消去了背景标定和共同匹配抑制，集中检验链权重与循环矩阵的相对谱。平方差的绝对值则继续检验整体质量尺度。","文中选用同一组振荡分析作比较。严格联合检验需要相关似然，不能只从两条边缘误差拼出独立高斯比值；第三个绝对质量也不能直接当成平方差开根号的测量值。"]},{"time":1065.4166666666665,"title":"十二条质量分支回到同一主链","narration":["回看第八章，带电轻子从同一相干源读出三组层级；下型再区分实方向读出和翻转链接；上型区分基准、返回与交付；中微子读取间接正核的三个本征值。","它们共享背景标定和完整相位读数，但每一族的路径、节点、记录和计时都有具体位置。谱形、绝对尺度与物理质量身份，由不同检验分别约束。","本章计算了九个带电基本态与三个中微子分支的质量谱。下一章继续看集体重子：色分量怎样形成并维持整体图案，以及它们与单个基本方向有什么关系。"]}]},{"id":9,"label":"第九章","title":"重子、夸克与色禁闭","description":"共同集体图案、内部表示与色禁闭","duration":1185.604329,"mb":11.1,"video":"https://hushaowu-rh.github.io/videos/paper16-ch9/video.mp4","poster":"https://hushaowu-rh.github.io/videos/paper16-ch9/poster.jpg","page":"https://hushaowu-rh.github.io/videos/paper16-ch9/","source_sha256":"12bfb282f2559ff3fc5e66248ff81d1cfb72d0324a5542147821b9a4381b9dc0","segments":[{"time":0.0,"title":"核子的整体与内部怎样共存","narration":["第八章从基本方向读取质量，第九章转向核子。一个质子或中子，既要作为整体持续存在，又要具有可区分的电荷、味和自旋。","本章把这些性质放进同一个状态：共同模式提供集体图案，内部表示承载差别，实际循环则同时给出返回相位和存续份额。","我们沿形成、内部结构、质量与维持、核交换这条主线前进，最后检查：内部带色分量在什么条件下不能成为独立输出。"]},{"time":40.083333333333336,"title":"全部地址共同组成一个图案","narration":["在有限深度的态空间中，让每个地址具有同样振幅，再作整体归一，就得到全空间集体图案。它可以按各个壳的平均态展开。","壳的份额等于该壳地址数除以总地址数，振幅则是份额的平方根。各壳不一定等份，但它们使用同一个相位参照。","这里的地址标定态空间模式。实际空间位置由后续读出确定，因此不能从全地址参与直接得出核子在空间中的大小。"]},{"time":76.95833333333334,"title":"跨壳缩放留下唯一共同方向","narration":["常值图案对所有乘法拉回都不变。反过来，只要一个函数对乘以素数的拉回保持不变，反复作用到有限深度，就把任意地址联系到零元。","于是所有地址上的函数值必须相同，共同固定空间只剩这一条方向。如果只要求单位群不变，不同壳仍可以取不同常数。","这个唯一性确定的是算术结构。含跨壳缩放的拉回一般不是酉作用，它本身还没有证明实际系统会形成或维持这个纯图案。"]},{"time":116.375,"title":"相同壳份额不等于同一个状态","narration":["把各壳份额填入对角线，还不足以确定集体图案。纯的共同图案在不同壳之间，另有由振幅乘积给出的非对角矩阵元。","壳去相位之后，这些交叉项消失，份额却完全可以保持不变。两个准备因此具有相同的壳占据，却有不同的跨壳响应。","本章用两个自伴可观测量分别读取交叉项的实部和虚部。实际辨认相干，仍要有相应联合仪器和被保留的相位参照。"]},{"time":153.95833333333334,"title":"共同模式容纳不同内部状态","narration":["共同模式只有一条射线，不能仅凭这条射线把质子和中子区分开。本章在明确指定的联合载体中，再保留色、味、自旋等内部自由度。","正性给出一个严格结论：如果模式的约化态精确是这个纯图案，完整密度算子必定分解为图案投影乘上一个内部态。","因此不同内部状态可以共用同一个模式读数。内部自由度彼此仍可纠缠；但若模式和内部非平凡纠缠，模式边缘就不再是这个纯投影。"]},{"time":194.08333333333334,"title":"各壳留下同一个环境末态","narration":["把一次归一的联合形成输出，按壳平均态展开，每一壳后面都跟着一个其余自由度向量。模式相干由这些向量的两两内积决定。","要得到目标纯图案，对角元必须给对份额，非对角元还要达到柯西施瓦茨等号并对齐相位。这恰好要求各壳留下同一个归一末态，只乘不同幅度。","若末态能把壳标签完全区分，内积变成零，得到的就是去相位混合态。这个判据检查一条条件分支，总形成概率还要按实际结果汇总。"]},{"time":237.25,"title":"正交壳记录为什么不够","narration":["附录中的固定壳平均恢复，给不同壳留下正交记录。因此它的任意一轮输出，对纯集体图案的重叠都有一个严格小于一的上界。","这说明那一项固定过程既不能一次制备纯图案，也不能在下一轮保持它。问题不在于壳份额算错，而在于环境还保留着可区分的壳记录。","下面引入已准备的相干参照，通过等谱交换交付完整集体图案。"]},{"time":270.9166666666667,"title":"相干参照把整体图案交付出来","narration":["另取一个具有同样能级的壳平均参照，把目标相干图案实际准备在参照中。交换两个壳平均空间，同时让方向空间旁路。","交换保持两端总能量，把目标图案交给物质模式，把原模式信息移到参照输出。即使原模式与内部纠缠，内部边缘也保持不变。","相干由准备好的参照供应，并非从一个混合态凭空恢复。形成后参照通常需要重新准备；下一轮继续保持图案，还要接上完整持续作用。"]},{"time":312.2916666666667,"title":"三份基本色表示组成单态","narration":["在指定的三维基本色表示中，三份载体可以用六个排列的带符号叠加组成完全反对称单态。整体作用等于行列式，而特殊酉群的行列式等于一。","这个单态对全部色变换不变。只检查三阶循环标签的和为零还不够；两份基本表示即使分次互补，也没有完整的色单态。","这里的反对称性来自色表示，尚未使用费米统计。每色一个也不要求味标签不同，所以它能与两个上味、一个下味，或者相反的组合相容。"]},{"time":354.6666666666667,"title":"味与自旋配对成核子候选","narration":["味与自旋各取两条正交的排列向量。自旋向量的总投影是二分之一，升算子作用为零，因此总自旋确实是二分之一。","把两种排列按相同指标配对相加，味与自旋按同一个实正交矩阵变换，配对求和因而保持不变，得到对三个位置置换不变的味自旋组合。","再乘完全反对称的色单态，并采用对称空间部分，完整内部态就满足所指定的费米交换规则。这给出相容候选态，自旋表示和物质对应仍是明确输入。"]},{"time":397.7916666666667,"title":"相同色单态可以有不同电荷","narration":["把上味电荷指定为三分之二，下味指定为负三分之一，再对三个位置相加，就得到质子电荷一，中子电荷零。","电荷和色作用在不同表示上，所以整体色单态完全可以带电。共同模式也不要求质子和中子拥有相同的内部循环相位。","色单态的任一位置约化态都是三分之一单位阵。它说明局部读数与整体相关，不能把取一个偏迹或做一次局部测量，直接解释成已经释放一个独立夸克。"]},{"time":437.4166666666667,"title":"共同集体尺度怎样进入核子","narration":["核子的共同基线沿用第六章的参与谱。三份基本色表示的最低单态，采用一加根号三倒数的谱参数，再由完整泽塔求和得到参与量。","在既定背景匹配和一吉电子伏特单位下，共同能标约为九百三十六点六六九兆电子伏特。它不是已经算出的质子和中子两个绝对质量。","这份数值采用领头方差等于三的处方。有限地址深度、正整数截止和完整谱求和必须区分；如果改用精确方差条件，数值也会改变。"]},{"time":479.0,"title":"参与权重进入实际谱端口","narration":["要把参与量接成实际频率，本章在共同模式之外保留一个入口和多条正交路径出口。第恩条路径的幅度取权重的平方根，共同系数取有限谱和的对数。","实际自伴生成元把乘法拉回接到去程，再把伴随接到返回。共同图案对去程拉回不变，因此能够计算它在这些端口上的压缩矩阵元。","但去程保持图案，不自动说明伴随返回也保持。端口相干、逐路径幅度和共同系数都有实际接线，下一步还必须保护完整返回。"]},{"time":522.375,"title":"完整保护保住亮态频率","narration":["用共同模式的反射，对整个生成元作同时平均，可以消除离开目标模式的交叉块，同时保留所有路径端口上的目标作用。","入口和路径亮组合构成一个二维块，两个本征频率正负成对，半隙等于根号谱和乘谱和的对数。这个频率来自实际矩阵元，而不只来自常函数的形状。","随后选取正亮准备并接入运动取向。完整空间中的负亮支和暗支仍然存在，选择一种准备不等于证明其他状态都被排除。"]},{"time":563.4583333333334,"title":"热处理保存整套振荡载体","narration":["在活动段，保护后的端口频率可以接到共同运动生成元。进入热处理时，则要把模式、全部路径端口和内部相关一起移到等谱副本。","每条成功结果都只给完整状态乘上该结果对应的标量，所需相干因此保留。只保存共同模式，而丢掉端口或它们的相关性，并不足以保存原来的振荡。","暂存、处理、逆交换以及自由相位补偿都算进完整时间。成功的可逆辅助按证明复用，失败态和输出共同退出；本节的条件频率不自动给出寿命。"]},{"time":608.6666666666667,"title":"物质与背景使用同一完整历史","narration":["集体端与背景端使用独立资源槽，却沿同一完整历史接受共同驱动。暂停和处理都包含在分母的总时间中，两端频率因此带着同一个平均驱动。","先把物质频率除以背景频率，公共时程因子相消。再只在真空端实行一次平方匹配，平均驱动就被标定为能量单位除以背景常数的平方根。","于是有限实现得到根号谱和乘对数的质量式。固定的是包含暂停的平均驱动，不是瞬时强度平方的时间平均；完整返回本身仍不单独固定绝对尺度。"]},{"time":653.6250000000001,"title":"相位和存续必须分别检验","narration":["共同模式的某个对角响应可以为零，顶点作用却仍把它送向非平凡方向。零元的有限份额，使这种离开分量并不自动消失。","因此持续质量读数和绝对稳定是两个检验。前者取返回相位，后者要逐个检查全部退出结果；若每轮只以一定份额留下，同准备独立重复时存续份额按幂下降。","最低三色单态，只说明它在指定族中处于最低集体尺度，不能代替对其他表示、粒子数和环境输出的检查，也不能单靠质量差决定中子的寿命。"]},{"time":698.5416666666667,"title":"质子与中子留下相反谱相位","narration":["现在在核子谱参数上求上味方向的复响应。它的实部约零点八七，虚部约零点三零，相位约零点三三弧度；共轭方向的相位相反。","在指定的相干乘积连接中，质子每个排列都含两个正向响应、一个共轭响应，中子则相反。味自旋的排列叠加不改变这两个总相位。","两者的模与实部相同，所以只读共轭偶的实量不能给出分裂。要得到质量差，仪器必须保留共轭奇部分，再给出相位到质量的具体对应。"]},{"time":740.3333333333334,"title":"两项内部修正一正一负","narration":["本章指定一个相位到质量的读出：负的共同能标平方除以电弱能标，再乘总谱相位的正切。相反相位于是给出相反的核子频移。","电磁项另用六路均分处方，使带电分支相对中性分支增加自能。因此中子减质子的差中，谱相位贡献为正，电磁贡献为负。","这里的正切、系数、符号和六路均分都有明确地位，不能仅从相位相加推出。电磁耦合已经含自身的匹配分母，也不能再把独立的六替换成那个分母。"]},{"time":782.625,"title":"相减后检验核子质量分裂","narration":["按未舍入输入，谱相位项约为正二点四四三兆电子伏特，电磁项约为负一点一三九，相加得到一点三零三六三兆电子伏特。","本章引用的科达塔二零二二实验中心值约一点二九三三三，模型结果高约百分之零点七九六，明显超过测量不确定度。更多小数位表示处方的复算精度，并不是更高的物理准确性。","尚未确定的共同偏移，在两者相减时严格消去。所以这里直接检验的是质量分裂，质子和中子的各自绝对质量仍需结合共同基线与共同频移。"]},{"time":828.9583333333334,"title":"有可用能量还不等于知道寿命","narration":["再减去第八章算出的电子质量，剩余可用能量约零点七九三兆电子伏特，远高于同一模型的中微子质量尺度。","因此中子变成质子、电子和反中微子，在这份质量对应下通过了能量方面的检查。但能量允许，不代表相应输出通道一定具有非零振幅。","还要给出满足联合守恒的实际顶点，计算退出份额和循环时间，才谈得上衰变及寿命。本章没有用质量差倒推这些动力学量。"]},{"time":868.1666666666667,"title":"核交换先看完整路径和记录","narration":["两个核子之间的交换，仍按发射、传播和吸收组织。两个端点必须采用完整核子状态，内部转换矩阵元与传播核一起进入路径振幅。","通向同一个未区分完整记录的路径先相加，再取模平方。互相正交的最终记录，才在概率级求和；若记录仍有重叠，就要保留交叉项。","共同模式相同不代表任意转换自动共振。能量、内部频移、电荷和交换环境都要配平，具体作用距离、自旋依赖及吸引排斥也要从顶点和传播核计算。"]},{"time":912.5833333333334,"title":"四十二条完整输出给出核响应","narration":["沿用第七章的接线，核交换包含四十二条可区分的完整输出，每路带着相同节点权重，共享共轭方向的平方响应。求和得到约十四点零九七的核响应。","这个大于一的数是响应强度，不是事件概率。实际分支还带作用振幅，振幅平方乘总响应才是匹配输入的交换概率，并受不超过一的限制。","核响应与色响应共享同一个平方谱响应，却采用不同准备和记录。它们在有效理论中的关系，以及具体核势，都需要进一步比较同一散射过程，不能只由两个耦合数的大小决定。"]},{"time":961.0833333333334,"title":"排除带色输出要逐条检查","narration":["把输入支撑固定下来，再把输出分成色单态和带色表示。对于一个实际仪器，带色份额就是每条结果中带色振幅的范数平方之和。","每项都非负，所以对所有允许输入都没有带色输出，当且仅当每条实际结果从输入支撑到带色输出的矩阵块都为零。","这是必要且充分的过程判据。它必须在完整结果集上检查，不能先筛掉带色支路，再把剩余成功结果宣布为禁闭。条件成功概率的归一不会改变零条件。"]},{"time":1002.875,"title":"怎样保证逐条结果不产生色荷","narration":["一种充分条件是：输入处在色单态空间，而且每条实际结果都交织输入和输出的完整色表示。它把不变向量仍送到不变向量，因此逐条满足零带色条件。","如果完整作用保持色表示，环境准备和所有实际耦合的环境输出又都是平凡色表示，那么相应环境矩阵元就能逐个成为这样的交织算子。","但通道整体协变比这个条件弱。环境若能带走补偿色，各条结果可以互相混合成一个非平凡表示，整体仍协变，却未必逐条排除带色输出。"]},{"time":1048.5,"title":"整体单态不排除局部带色支撑","narration":["考虑一份基本色表示和一份共轭表示，把三个互相补偿的色标签等幅配对。整体是单态，任一局部约化态却是三分之一单位阵。","这个局部密度算子在色变换下不变，但它支撑的三维基本表示没有单态向量。所以密度算子群不变，与支撑在单态子空间，是两个不同命题。","偏迹也不完成物理分离。要成为独立物质，还须有明确的输出载体，检查补偿色的相互作用、记录以及分离后的循环维持，不能仅凭局部状态形式下结论。"]},{"time":1093.0833333333333,"title":"完整谱能证明相对响应压低","narration":["谱结构另给出一个严格约束。非平凡特征标的每周期和为零，部分和有界；分部求和便控制它的狄利克雷响应，而完整泽塔谱在接近一时发散。","于是两者的相对响应，被素数乘谱参数偏离一的大小控制，并趋于零。这个结论对实的非平凡方向也成立，并不只是复方向的现象。","这是完整谱的相对压低，不是有限分离仪器的带色概率。普遍禁闭仍需覆盖所有允许分离过程，证明逐项零输出，或者证明输出不能长期独立维持。"]},{"time":1137.1666666666665,"title":"把整体、质量与禁闭放回同一状态","narration":["第九章用同一个完整对象组织核子的性质：相干参照交付共同图案，色与味自旋表示承载内部区别，持续端口和背景标定给出共同频率。","相反谱相位与本章采用的正切、电磁处方给出质量差，完整路径和记录给出核交换响应。返回相位、离开份额和带色输出由同一对象的相应过程分别计算。","集体形成与维持已经在所给构造中接通；绝对稳定检验全部退出通道，普遍禁闭检验所有允许分离过程的带色输出与独立维持。下一章继续看交换激发与背景振荡。"]}]},{"id":10,"label":"第十章","title":"玻色子","description":"通道激发、π介子与Higgs径向恢复","duration":939.520996,"mb":8.5,"video":"https://hushaowu-rh.github.io/videos/paper16-ch10/video.mp4","poster":"https://hushaowu-rh.github.io/videos/paper16-ch10/poster.jpg","page":"https://hushaowu-rh.github.io/videos/paper16-ch10/","source_sha256":"12bfb282f2559ff3fc5e66248ff81d1cfb72d0324a5542147821b9a4381b9dc0","segments":[{"time":0.0,"title":"玻色子：交换与背景的振荡","narration":["前面几章讲稳定态怎样形成、维持和交换。第十章接着看，交换中实际传播的分量，以及背景受到扰动后的振荡。","本章沿三条过程展开。光子、W、Z与胶子属于所选通道激发；π介子联系核子内部的色单态跃迁；Higgs对应背景幅度的径向恢复。","三类激发共用振幅复合、记录求和及相位计时规则。我们逐一看清各自的载体和质量读数。"]},{"time":35.958333333333336,"title":"沿发射、传播、吸收追踪激发","narration":["一次交换可以分成三个作用：发射产生交换分量，传播把它送往另一端，接收使另一稳定态和环境发生改变。","发射端损失、交换分量携带、接收端取得的能量与荷，放在同一个联合过程里核算。","多条路径到达同一个未区分记录，就先相加振幅；末态记录正交，才相加概率。频率与传播状态都从实际作用读出。"]},{"time":69.875,"title":"内部荷、自旋与交换各有位置","narration":["电荷和色荷作用于内部表示，自旋描述观测空间中的旋转。这是两组不同的作用。","本章对通道采用矢量传播表示，对径向幅度采用标量表示；相同激发的双体状态还采用对称交换对应。","这些设置明确以后，量子数与质量就能分别核对。一个character标签或一个群生成元，不同时承担全部物理身份。"]},{"time":102.33333333333334,"title":"实际双向交换给出质量平方","narration":["把入口到暂存出口的实际耦合记为B，同时保留伴随的逆交换。对入口振幅再求一次时间导数，就得到负的B伴随乘B。","如果这个Gram矩阵的本征值是西格玛平方，入口与相应亮输出构成二维不变空间，本征频率是正负西格玛。","入口的返回振幅是余弦，转移概率是正弦平方。本章质量读静止半隙西格玛；概率振荡的角频率则是它的两倍。"]},{"time":138.29166666666669,"title":"把完整振荡载体交还回来","narration":["要保住振荡，保护空间同时包含入口和亮输出。只保入口，会把需要的非对角交换消去。","热处理把完整振荡载体暂存到等谱副本，成功时以同一个标量归还全态，处理和等待的时间全部记入周期。","于是完整时间下的质量，是活动半隙乘以活动时间所占的份额。物质和背景共用这份计时，后面才能作同源标定。"]},{"time":171.58333333333334,"title":"凝聚份额接入同一质量平方","narration":["第六章给出共同电弱标尺。本章把凝聚的二次权重分配给通道：先取该通道的参与份额，再除以它的有效匹配分母。","响应列的范数平方给过程侧平方响应，写成W乘以log W的平方；接受列给份额除以匹配分母。二者相乘，再沿用共同背景标定。","共同背景标定再把这个频率写成屏幕上的质量平方。匹配分母可以不是整数，它表示准备权重比。"]},{"time":209.125,"title":"光子与Z来自同一中性响应","narration":["中性弱方向与Abel方向，各提供一个入口。实际响应让两路按同一个有符号组合汇入完整出口。","与这个组合平行的方向称为Z；与它正交的组合称为光子方向。光子组合的两路响应在出口正好抵消。","在采用这项凝聚贡献作为全部静止质量项的扇区里，质量平方只有一个非零本征值，所以光子方向是零模。"]},{"time":241.20833333333334,"title":"零模由响应列的线性关系决定","narration":["这个零模可以直接检验。两列响应的Gram行列式，等于两个范数平方的乘积，减去内积模平方。","对于非零响应列，行列式为零正好要求两列共线。相干公共出口正是实现这个关系的连接。","若把两入口分别写入正交的路径记录，响应列通常不再共线，干涉抵消也随之改变。因此检查的是实际返回的列，而不是只数中性空间有两个方向。"]},{"time":276.0,"title":"两种偏振来自横向空间","narration":["光子的偏振在空间传播表示里计算。给定非零传播方向，复三维振幅满足横向约束，就剩下两个独立方向。","两条实横向基可以组合成左右旋的圆偏振。绕传播轴旋转时，它们取得符号相反的相位；线偏振则是两者的相干组合。","零静止质量与有限传播能量相容。传播速度和位移仍从具体传播核读取，内部共轭标签在这里承接两种旋向。"]},{"time":312.2916666666667,"title":"W的电荷与质量分别计算","narration":["弱内部作用的升降生成元承接正负电荷，第三个生成元进入中性混合。电荷的正负与空间偏振的正负，属于不同自由度。","W通道采用完整凝聚份额，匹配分母使用第七章已经求得的再分配修正，而不是裸计数十八。","代入共同标尺与平方常数，W的质量是八十点五七三三吉电子伏。电荷共轭对称的两成员得到同一质量。"]},{"time":346.58333333333337,"title":"Z的分母包含中性投影与两路修正","narration":["Z继续使用由Born顶点比确定的混合基。它的有效分母分成三块：有质量组合的中性投影、弱通道再分配、以及两条额外混合路由。","两路留下可区分记录，各向同一个分母贡献一份权重；每一路内部的两个中性入口，仍保持相同的相干组合。","这样既保留光子的零方向，又得到Z的匹配分母约十四点一七四九，质量约九十一点四一四八吉电子伏。"]},{"time":383.0416666666667,"title":"顶点角与质量比角读取不同量","narration":["顶点角从电磁与弱的Born响应比定义，得到正弦平方约零点二三一四六。","质量比角则从修正后的W与Z质量定义，得到约零点二二三一三。二者在这一过程里相差约零点零零八三四。","共同能标从W与Z的质量比中消去，但这不把两种角变成同一个读数。比较实验时，需要对应各自的顶点与质量定义。"]},{"time":416.0,"title":"绝对质量与质量比各作检验","narration":["直接计算给出W约八十点五七三三、Z约九十一点四一四八吉电子伏。相对文中采用的实验中心值，两者都高约百分之零点二五。","如果另用实验Z质量作标尺，只检验模型的质量比，就得到W约八十点三七三四吉电子伏。","后一个计算使用了一项实验输入。视频把这两种检验分开呈现；绝对结果的偏差仍然保留，也超过所列实验误差。"]},{"time":453.5416666666667,"title":"八个色方向由无迹响应组成","narration":["三维色载体上的自伴响应共有九个实参数。迹部分是色盲响应，去掉它，剩下八维无迹空间。","可以取三对非对角方向，加上两个独立的无迹对角方向，组成具体基。色变换按共轭作用在这些矩阵上。","把通道内部激发对应为这份伴随表示，就得到八个色方向。传播偏振另外计算；非零对易子描述这些色响应的复合结构。"]},{"time":487.6666666666667,"title":"凝聚质量与带色输出分别检验","narration":["本章选择破缺作用在二值因子，色通道不取得凝聚质量份额，所以这项质量贡献为零。","这个零值来自所选质量机制。单独保持色对称，也容许伴随空间上的正质量倍数，因而需要交代完整生成元。","讨论独立胶子时，再检查每条实际结果是否给出可独立维持的带色输出。八维内部结构、零凝聚质量与输出禁闭，各自在对应的过程里检验。"]},{"time":523.7916666666667,"title":"π把色单态与味变化连起来","narration":["核子交换可以保持共同集体图案，同时改变内部味。本章把一种色单态、味非平凡的交换分量与π介子联系起来。","基本色表示与共轭色表示的三项配对和，给出归一色单态。味部分分别组成正、负和中性的π成员。","两组分电荷直接相加，得到正一、负一和零。这里明确使用完整的组分与反组分表示。"]},{"time":556.2083333333334,"title":"π的零自旋与负宇称怎样读取","narration":["两个自旋分量取反对称组合，形成总自旋为零的单态。相对轨道取零，总角动量也为零。","再采用组分与反组分内禀宇称乘积为负一的对应，整体得到负宇称，所以π是赝标量。","Higgs在后面取正宇称径向标量。两者都可以有零自旋，但宇称与实际恢复过程不同。"]},{"time":585.3333333333334,"title":"集体与味的两层响应怎样合成","narration":["π质量使用同一批模型输入：共同核子基线，以及上、下夸克的质量读数。先用同一个能量单位把它们无量纲化。","味侧两个正交结果先相加；集体侧与味侧采用乘积准备，使两份响应相乘。三条等强且可区分的色重排输出，再使总响应乘三。","本章把总响应的振幅级读数对应为π质量，得到π质量平方等于三倍核子基线乘以上、下夸克质量之和。"]},{"time":623.4166666666667,"title":"共同π质量保留在两成员之间","narration":["代入未舍入的输入，共同π质量约一百三十八点二八九五兆电子伏。这里使用模型集体基线，没有换成实验质子质量。","对文中引用的带电π中心值，它低约百分之零点九二；对中性π，则高约百分之二点四五。两成员的电磁分裂需要另算。","在固定其他输入的形式极限中，上、下夸克质量一起趋零，这个质量式也趋零。这是当前关系的极限行为。"]},{"time":660.2916666666667,"title":"Higgs追踪背景幅度的恢复","narration":["凝聚振荡从背景幅度的偏离开始。共同尺度记为v，附近的实径向偏离记为h。","本章选择电中性、旋转不变、空间反演为偶的幅度，把它对应为零自旋正宇称的Higgs候选。","接下来沿实际恢复过程求频率。共同背景上还可能容纳哪些其他振荡，则由第十一章的完整涨落空间来检查。"]},{"time":690.3750000000001,"title":"全同取向给出两条接受事件","narration":["恢复过程为每个非零点对配置一个二值辅助，采用独立均匀准备。所有检查都为正、或者都为负，组成两个互斥接受事件。","每个检查取一半，独立相乘后，单取向份额就是二的负m次方。两种全同取向相加，给总份额q。","取p等于七，三个二值检查共有八种等权配置。全正和全负各占八分之一，合计四分之一。"]},{"time":725.3750000000001,"title":"两条事件交回同一个径向模式","narration":["两条接受事件可以交回同一个径向模式，同时在环境保留不同记录。其余六种配置送往补结果，完整仪器的总概率为一。","份额翻倍来自两个不同的输入事件。如果只把一个事件重新标成两种记录，它们只能分配原来的份额，不能让概率翻倍。","现在接受比例已经算出。要让它进入振荡频率，还要明确入口和返回端点。"]},{"time":758.1250000000001,"title":"份额进入频率，靠相干亮回程","narration":["如果只是对混合准备筛选接受事件，信号是q乘正弦平方，改变的是幅度，接受支频率仍为原来的耦合。","本章保留可逆纯化辅助，从同一个入口相干连接所有接受分量。接受向量的范数是根号q，实际亮双态的耦合因此成为原耦合乘根号q。","两种过程的短时二阶一致，四阶已经不同。画面分别画出它们的完整转移曲线，显示份额怎样真正进入返回频率。"]},{"time":796.2500000000001,"title":"Higgs与背景受同一个平均驱动","narration":["将径向交换和背景作用放在联合生成元的两个因子上，用同一个形成源、同一驱动和两臂保护同时作用。","交织关系让它们在载体内取得同一个瞬时系数。把活动作用积分，再除以包含全部返回和等待的时间，就得到共同平均驱动。","同一历史的质量与背景之比因此是根号q。采用本章的背景平方标定，平均驱动对应v，便给出Higgs质量。"]},{"time":832.0416666666667,"title":"三对取向给出 m_H = v/2","narration":["对于三个点对，总接受份额是四分之一，它的平方根是一半。因此Higgs质量等于共同电弱标尺的一半。","沿用前文标尺，得到一百二十三点零九五七吉电子伏。相对文中引用的实验中心值，低约百分之一点六八，尚未达到该实验精度。","这个数的来源已经可以逐项追踪：独立取向准备给份额，相干亮回程把份额转成频率，同源标定给出绝对单位。"]},{"time":867.8750000000001,"title":"同一径向变化联系既有质量","narration":["若费米质量正比于v，矢量质量平方正比于v平方，把同一径向变化v加h代入，便能直接求导。","费米质量的一阶响应是质量除以v；矢量质量平方的一阶响应是两倍质量平方除以v。","这些比例在固定无量纲系数时成立。它们把径向扰动与已有质量连接起来，再由实际跃迁顶点承接对应的耦合读数。"]},{"time":901.0416666666667,"title":"把三类激发放回同一过程","narration":["通道激发从实际耦合的Gram矩阵读质量平方。光子与Z共用中性响应，W与Z质量由各自匹配分母读出。","胶子的八维内部表示、π的色单态味跃迁和Higgs的径向恢复，各有明确的状态与读数。π采用两层响应的质量对应，径向亮模则由实际回程得到频率。","它们共用前文的背景标尺。接下来第十一章进一步检查，这些结构和模式在所讨论空间里覆盖到哪里。"]}]},{"id":11,"label":"第十一章","title":"谱完备性","description":"结构清单、正常模与完整返回的覆盖","duration":806.645996,"mb":7.3,"video":"https://hushaowu-rh.github.io/videos/paper16-ch11/video.mp4","poster":"https://hushaowu-rh.github.io/videos/paper16-ch11/poster.jpg","page":"https://hushaowu-rh.github.io/videos/paper16-ch11/","source_sha256":"12bfb282f2559ff3fc5e66248ff81d1cfb72d0324a5542147821b9a4381b9dc0","segments":[{"time":0.0,"title":"清单怎样才算完整","narration":["前文已经给出基本态、集体态和交换激发。第十一章把它们放在一起，检查这份物质与作用清单的覆盖范围。","第一层看结构基与表示是否列全，第二层看实际循环保持哪些模式，第三层看还有没有清单外可形成、可维持而且可读的对象。","这三层连接起来，完备性就有了明确的检验对象。我们先从有限的种类基开始，再走到完整返回。"]},{"time":36.166666666666664,"title":"种类层的基可以精确列全","narration":["模p的单位群是p减一阶循环群。每个character给它的各个位置赋上一组规则相位，共有p减一个不同标签。","比较两个标签时，把相位差沿整个群求和。标签相同，各项都是一；标签不同，这些单位圆上的箭头恰好抵消。","因此这些向量构成种类层的正交归一基。平凡标签是单位壳平均态，其余p减二个方向构成非平凡种类层。"]},{"time":73.33333333333333,"title":"种类层放在更大的态空间里","narration":["完整态空间按赋值壳展开。每一个非零壳有一个平凡方向，终端零元再给一个，所以共同部分的维数是K加一。","全部维数是p的K次方。减去共同部分，完整非平凡方向空间的维数就是p的K次方减K减一。","例如p等于七、深度等于二，完整空间有四十九维，其中共同部分三维、方向部分四十六维。其他壳和较高导体方向怎样参与物质，要继续看作用和读出。"]},{"time":113.125,"title":"共轭轨道与代间分组","narration":["复共轭作用在种类标签上。p等于七时，非平凡标签分成一个自共轭方向，以及两对复共轭方向，一共三条轨道。","位置取负则把六个非零位置分成三个点对：一与六、三与四、二与五。这次分组作用在位置上。","一个完整character同时分布在所有位置组上。第八章的三代读数来自形成图案在位置组上的读出，以及相应质量作用，而非把三条共轭轨道直接叫作三代。"]},{"time":151.54166666666666,"title":"十二条质量读数怎样计数","narration":["第五章采用的物质对应，把非平凡方向组织为中微子、带电轻子、上型夸克和下型夸克四类。","第八章为每一类算出三条质量读数，合起来是十二项。反粒子、颜色、自旋和空间偏振并不在这个口径下重复计数。","这张表清楚覆盖了既定对应中的分支。若要进一步排除额外同类分支，还要检查其他允许准备和内部表示怎样进入实际循环。"]},{"time":187.54166666666666,"title":"保形要求整幅图案同相返回","narration":["先看在character基上对角化的谱响应。任意图案都能展开成各方向的叠加，作用后，每个系数分别乘上对应复本征值。","要让整幅图案只乘一个共同系数，所有非零分量必须属于同一个非零本征值。模长相同但相位不同，仍会改变图案。","若本征值简并，同一空间里的相干叠加都能保形。这些不同纯态射线不各自增加一种粒子；种类还由表示、可读区别与完整循环确定。"]},{"time":226.375,"title":"共同图案保留一整族内部态","narration":["乘p拉回的共同固定方向是全空间同幅同相图案b。在既定的模式与内部分解中，模式约化态若是纯的b，联合态必写成b的投影乘上内部态西格玛。","因此共同图案可以唯一，内部态仍有一整族。第九章的质子和中子就共享整体图案，而由内部味、自旋和循环读数区分。","平凡种类方向只在单位壳上分布，集体图案b则含全部壳与零元。图案、内部状态和实际返回各自承担明确的任务。"]},{"time":268.25,"title":"色单态允许哪些层级","narration":["取d维颜色基本表示。n份这样的表示合成单态，中心相位必须抵消，所以d必须整除n。反过来，每d份组成一个完全反对称张量，就给出单态。","三色时，纯基本表示允许三份、六份、九份这些层级。最低三份的单态空间是一维，六份已经能够有线性无关的不变张量。","加入共轭表示时，两份也能构成色单态。这里n计张量位置，不自动等于观察到的粒子数；每一层级都有自己的载体与允许作用。"]},{"time":313.125,"title":"把内部态族接回形成与维持","narration":["第九章的守能参照交换，已经把参照里的跨壳相干交付给集体图案，并为所选载体构造了持续作用和热返回。","向更高色单态层级推广时，就沿同一过程落实内部表示、相干参照与实际端点，再求参与权重和恢复频率。","这样得到的集体序列以b为共同图案，以内部表示和循环区分成员。最低层的核子能标为已有结果，更高层的频率由各自过程继续计算。"]},{"time":351.125,"title":"局部作用的分类为何闭合","narration":["把p减一分解为互素素数幂，种类层相应成为若干因子的张量积。每个因子的无迹自伴作用给一个特殊酉代数，共同标量只计一次。","同一因子内部的对易子仍留在该因子，不同因子的局部作用彼此对易，所以这类作用对李括号闭合。","p等于七时，得到一个阿贝尔因子、一个二阶因子和一个三阶因子。这里是三个结构因子，十二个实生成方向，两个数各有所指。"]},{"time":388.125,"title":"全部算子空间怎样与局部作用对照","narration":["二阶和三阶因子合起来是六维空间。全部自伴矩阵有三十六个实维度，局部作用占十二维，剩余二十四维由双因子无迹张量积张成。","这类联合项与全部局部作用在迹内积下正交，自身范数却非零。它们是否作为直接生成项出现，要看实际允许作用。","局部算子的顺序乘积也可以含有这种张量积。这表示一个复合过程，并不自动新增一种独立相互作用。"]},{"time":424.8333333333333,"title":"五类作用的计数对象","narration":["沿前文的物质表示与作用对应，三个基本结构因子用于电磁、弱和色响应。再加集体态之间的核共振，以及能量与几何的度量响应，得到五类。","这个数计响应类别。色的八个内部方向、W的两个电荷成员、不同记录和空间偏振，都不会各自增加一种力。","第十章给出光子、W、Z、胶子和π的激发实现。度量作用目前通过能量与几何响应描述，还没有单独构造引力传播量子。"]},{"time":464.54166666666663,"title":"背景振荡要在完整涨落空间求解","narration":["背景附近允许怎样偏离，决定振荡模式能有多少。把所有纳入的实幅度组成一个向量，动力学归一用正定矩阵G，恢复作用用半正定矩阵K表示。","小振荡满足G乘加速度，再加K乘幅度等于零。代入单频振荡，得到广义本征问题：K作用于u，等于欧米伽平方乘G作用于u。","用G的正平方根换坐标，就得到一个普通的实对称半正定矩阵L。它的正交本征基给出这份涨落空间里的全部正常模。"]},{"time":507.3333333333333,"title":"正频率与零方向合起来覆盖全空间","narration":["实对称矩阵有完整本征基，所以正频率方向数等于恢复矩阵的秩，零方向数等于总维数减去这个秩。","这里按重数计方向。同一个频率可以对应多个独立振荡方向，不能只数不同的频率数值。","零方向在线性方程中没有恢复力。它能否对应传播中的无质量粒子，还要结合实际传播、读出与完整循环来判断。"]},{"time":538.5833333333333,"title":"径向分支怎样放入全谱","narration":["第十章已从相干亮模的完整返回和同源标定，算出选定径向分支的频率。现在把这条分支放进完整涨落空间，检查恢复作用是否仍把它送回自身。","满足本征方程时，频率平方也等于恢复能与动力学归一的比值。仅算出这个比值，并不能代替前面的向量本征方程。","例如同一个b上允许两个独立幅度，恢复矩阵取两个正对角元，就有两个正频率。因此共同背景的唯一性，与Higgs类正常模的数目，是两个不同问题。"]},{"time":582.2083333333333,"title":"真正的保形由全部返回记录共同决定","narration":["现在回到实际返回。把每种返回结果对应的算子记为R下标a，全部结果按概率相加，组成完全正的迹不增映射。","纯态返回后保持同一条射线，当且仅当每个返回算子都把它送到自身的倍数，且总返回份额大于零。证明只需看正交方向上的范数平方：这些非负项之和为零，每一项就都必须为零。","因此共同本征空间给出全部纯保形返回模式。源、辅助和永久记录应在同一载体内处理；质量则继续读取相对于参照的相位。"]},{"time":627.9583333333333,"title":"已有形成过程怎样进入持续轨道","narration":["第二章已经给出一个具体形成循环。码内相干的谱根，模长是共同返回份额q下标T，相位来自两条能量读数的差。","其他暂态的谱半径至多是q下标T乘根号卡帕，并且严格更小。因此在存续归一以后，所选暂态域逐步接近持续轨道。","这个构造允许码外输入流入。接下来用于排除遗漏的分块覆盖定理采用另一组前提，两项结果各自使用自己的实际返回结构。"]},{"time":667.7499999999999,"title":"用补空间的返回上界检查遗漏","narration":["设P是清单已纳入的候选载体，Q是补空间。现在要求每个实际返回算子都与P对易，并让补空间总返回效应有一个上界s星。研究阈值s下标min事先固定，且严格高于这个上界。","若一个保形态的返回份额达到阈值，它在补空间里的分量也应以同样份额返回。但补空间最多只能达到更低的上界，所以这个分量必须为零。","对混合态在补空间取迹，也得到同样结论：达到阈值的保形态都落在P里面。这样，补空间效应界就把有没有遗漏变成可计算的检验。"]},{"time":717.5416666666665,"title":"长期衰减仍可是一种有限寿命模式","narration":["考虑一个只有两条方向的返回算子，第一条乘一，第二条乘根号q，其中q在零与一之间。两条方向都保持自己的形态。","第二条方向经过n轮，返回份额变成q的n次方，越来越小。它仍是有限寿命的保形模式，不能因为长期衰减，就说这条模式从未存在。","如果要覆盖全部正返回份额，而不只覆盖阈值以上的模式，在前述分块条件下，把补空间返回效应算到零就是一个充分判据。"]},{"time":759.9166666666665,"title":"把三个排除问题放回各自的位置","narration":["排除第四代，要让所有同类可形成、可维持而且可读的质量分支都落进指定族块，再由族内三组穷尽。排除额外作用，要覆盖全部允许的独立生成与响应。","排除第二个Higgs类模式，则要建立完整物理涨落空间，并证明相同量子数和读出类里只有一个正常模。三件事检查的是不同对象。","本章的推进，是把结构清单接到实际返回：基与表示列出候选，共同本征条件找出保形模式，补空间上界检查遗漏。这样，后续研究就有了明确的覆盖标准。"]}]}]</script>
<script>
'use strict';
const chapters=JSON.parse(document.getElementById('chapter-data').textContent),byId=new Map(chapters.map(c=>[c.id,c]));
const $=id=>document.getElementById(id),KEY='paper16-video-series-v1';
let state={last:1,rate:1,continuous:true,positions:{}};
try{const p=JSON.parse(localStorage.getItem(KEY));if(p&&typeof p==='object'){state={...state,...p};if(!state.positions||typeof state.positions!=='object')state.positions={}}}catch{}
if(![.75,1,1.25,1.5,2].includes(Number(state.rate)))state.rate=1;
let video=null,current=null,serial=0,ready=false,lastSave=0;
const clock=t=>`${Math.floor(t/60).toString().padStart(2,'0')}:${Math.floor(t%60).toString().padStart(2,'0')}`;
const safeTime=t=>Number.isFinite(Number(t))?Math.max(0,Number(t)):0;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
function savedTime(id){const p=state.positions[id];return p&&!p.done?safeTime(p.time):0}
function save(force=false){
 if(!video||!current||!ready||!Number.isFinite(video.currentTime))return;
 const now=Date.now();if(!force&&now-lastSave<4000)return;lastSave=now;
 const old=state.positions[current.id]||{};
 state.positions[current.id]={time:video.currentTime,done:Boolean(old.done&&video.ended)};
 state.last=current.id;persist();paintProgress();
}
function paintProgress(){
 for(const c of chapters){
  const p=state.positions[c.id],row=$(`chapter-${c.id}`);if(!row)continue;
  row.querySelector('.track').style.width=`${p?.done?100:Math.min(100,100*safeTime(p?.time)/c.duration)}%`;
  row.querySelector('.saved').textContent=p?.done?'已看完':safeTime(p?.time)>2?`看到 ${clock(p.time)}`:'';
 }
}
function readHash(){
 const p=new URLSearchParams(location.hash.slice(1));const id=Number(p.get('chapter'));
 return byId.has(id)?{id,time:p.has('t')?safeTime(p.get('t')):null}:null;
}
function address(id,time=null,mode='push'){
 const h='#chapter='+id+(time!==null?'&t='+Math.floor(time):'');
 if(location.hash===h)return;
 history[mode==='replace'?'replaceState':'pushState']({chapter:id},'',h);
}
function play(){if(!video)return;const v=video;v.play().catch(()=>{if(v===video)$('status').textContent='已定位到这一段，点击视频中的播放按钮即可观看。'})}
function markSegment(){
 if(!video||!current)return;let j=0;current.segments.forEach((s,i)=>{if(video.currentTime>=s.time)j=i});
 document.querySelectorAll('.segment').forEach((b,i)=>{b.classList.toggle('active',i===j);if(i===j)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current')});
}
function seek(t,{start=true,update=true}={}){
 if(!video||!current)return;const target=Math.min(safeTime(t),Math.max(0,current.duration-.15));
 video._requestedTime=target;
 if(ready){video.currentTime=target;state.positions[current.id]={time:target,done:false};persist();paintProgress();markSegment()}
 if(update)address(current.id);
 if(start)play();
}
function choose(id,{time=null,start=false,nav='push'}={}){
 if(!byId.has(id))return;
 save(true);const old=video;const volume=old?old.volume:1,muted=old?old.muted:false;
 serial++;const generation=serial;ready=false;current=byId.get(id);state.last=id;persist();
 if(old){old.pause();old.removeAttribute('src');old.load()}
 const c=current;const target=Math.min(time===null?savedTime(id):safeTime(time),Math.max(0,c.duration-.15));
 $('chapter-number').textContent=c.label;$('watch-title').textContent=c.title;$('description').textContent=c.description;
 $('status').textContent='';$('prev').disabled=id===1;$('next').disabled=id===chapters.length;
 $('standalone').href=c.page;$('download').href=c.video;$('download').textContent=`下载本章 · ${c.mb} MB`;
 $('segment-count').textContent=c.segments.length+' 段';
 for(const k of chapters){const el=$(`chapter-${k.id}`);el.setAttribute('aria-current',String(k.id===id))}
 const segFrag=document.createDocumentFragment();const tranFrag=document.createDocumentFragment();
 c.segments.forEach(s=>{
  const b=document.createElement('button');b.className='segment';b.dataset.time=s.time;
  const stamp=document.createElement('span');stamp.className='stamp';stamp.textContent=clock(s.time);const text=document.createElement('span');text.textContent=s.title;b.append(stamp,text);
  b.onclick=()=>{seek(s.time);$('video-host').scrollIntoView({behavior:'smooth',block:'start'})};segFrag.append(b);
  const h=document.createElement('h3');h.textContent=clock(s.time)+' '+s.title;tranFrag.append(h);
  for(const line of s.narration){const p=document.createElement('p');p.textContent=line;tranFrag.append(p)}
 });$('sections').replaceChildren(segFrag);$('transcript').replaceChildren(tranFrag);
 const v=document.createElement('video');video=v;v.id='video';v.controls=true;v.playsInline=true;v.setAttribute('webkit-playsinline','');v.preload='metadata';v.poster=c.poster;v.src=c.video;v.volume=volume;v.muted=muted;v.playbackRate=Number(state.rate);v._requestedTime=target;
 $('video-host').replaceChildren(v);
 const active=fn=>(...args)=>{if(generation===serial&&v===video)fn(...args)};
 v.addEventListener('loadedmetadata',active(()=>{
  v.currentTime=Math.min(v._requestedTime,Math.max(0,v.duration-.15));ready=true;v.playbackRate=Number(state.rate);markSegment();save(true);
  const route=readHash();if(route?.id===id&&route.time!==null)address(id,null,'replace');
  if(target>2&&!start)$('status').textContent=`已接到 ${clock(target)}，点击播放可继续观看。`;
 }));
 v.addEventListener('timeupdate',active(()=>{markSegment();save()}));
 v.addEventListener('pause',active(()=>save(true)));
 v.addEventListener('play',active(()=>{$('status').textContent=''}));
 v.addEventListener('error',active(()=>{$('status').textContent='这章暂时加载失败。可以重选本章，或使用“下载本章”直链打开。'}));
 v.addEventListener('ended',active(()=>{
  state.positions[id]={time:c.duration,done:true};persist();paintProgress();
  if(state.continuous&&byId.has(id+1))choose(id+1,{time:0,start:true});
  else $('status').textContent=id===chapters.length?'已看完最后一章。可以从目录选择章节重看。':'本章播放结束，可以选择下一章。';
 }));
 v.load();if(nav!=='none')address(id,null,nav);paintProgress();if(start)play();
}
for(const c of chapters){
 const b=document.createElement('button');b.className='chapter';b.id=`chapter-${c.id}`;b.dataset.chapter=c.id;
 const num=document.createElement('span');num.className='number';num.textContent=String(c.id).padStart(2,'0');
 const body=document.createElement('span'),title=document.createElement('strong'),desc=document.createElement('span');title.textContent=c.title;desc.className='desc';desc.textContent=c.description;body.append(title,desc);
 const times=document.createElement('span'),duration=document.createElement('span'),saved=document.createElement('span'),track=document.createElement('span');duration.className='duration';duration.textContent=clock(Math.round(c.duration));saved.className='saved';track.className='track';times.append(duration,saved);
 b.append(num,body,times,track);b.onclick=()=>{choose(c.id,{start:true});$('watch-title').scrollIntoView({behavior:'smooth',block:'start'})};$('chapter-list').append(b);
}
$('prev').onclick=()=>choose(current.id-1,{start:true});$('next').onclick=()=>choose(current.id+1,{start:true});$('restart').onclick=()=>seek(0);
$('continuous').checked=state.continuous!==false;$('continuous').onchange=e=>{state.continuous=e.target.checked;persist()};
$('rate').value=state.rate;$('rate').onchange=e=>{state.rate=Number(e.target.value);if(video)video.playbackRate=state.rate;persist()};
$('directory-link').onclick=e=>{e.preventDefault();$('chapter-directory').scrollIntoView({behavior:'smooth',block:'start'})};
addEventListener('hashchange',()=>{const route=readHash();if(route)choose(route.id,{time:route.time,nav:'none'})});
addEventListener('pagehide',()=>save(true));document.addEventListener('visibilitychange',()=>{if(document.hidden)save(true)});
const route=readHash();choose(route?.id??(byId.has(Number(state.last))?Number(state.last):1),{time:route?.time??null,nav:'replace'});
</script></body></html>
